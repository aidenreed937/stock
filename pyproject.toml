[project]
name = "stock"
version = "0.1.0"
description = "Financial & Stock Analysis Scaffold with uv, Polars, DuckDB and Pydantic"
readme = "README.md"
authors = [
    { name = "aidenreed937", email = "aidenreed937@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "jinja2>=3.1.5",
    "loguru>=0.7.3",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
    "scipy>=1.18.0",
    "tushare>=1.4.0",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "maturin>=1.8.0",
    "mypy>=1.15.0",
    "pre-commit>=4.1.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.10",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

# 明确只对本项目源码及测试路径进行规则约束
src = ["src", "tests"]

# 排除第三方包、虚拟环境及数据/缓存目录，绝不扫描第三方依赖
exclude = [
    ".agents",
    ".venv",
    "venv",
    "data",
    "build",
    "dist",
    "notebooks",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP",
    "C90", "PLR", "B", "SIM",
    "T20", "PTH", "ERA", "RET", "RUF", "S",
    "D", "C4", "PT", "TCH", "FBT"
]
# PLR2004: 魔数, S311: random 随机数, RUF001/RUF002/RUF003: 中文标点符号在注释和日志中属于正常使用
# D: 内部模块 docstring 风格, FBT: 布尔参数类型, T201: 控制台交互 print, ERA001: 注释代码, PTH: pathlib 迁移
ignore = [
    "PLR2004", "S311", "RUF001", "RUF002", "RUF003",
    "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D400", "D415",
    "FBT001", "FBT002", "FBT003",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
    "T201", "ERA001", "S608", "C901", "E501",
    "S110", "S112", "TC001", "TC002", "TC003", "SIM102", "SIM103", "SIM105", "SIM212", "RET504", "RUF005", "RUF012", "RUF100",
    "PTH", "B905", "C408", "C414", "PLR1714", "F601"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D", "PT018", "SIM117", "E402", "PLR", "C901", "FBT"]  # 测试文件中允许使用 assert、硬编码测试 token，且不强制要求 docstring
"scripts/*" = ["T201", "D"]                # 运维/门禁脚本允许使用标准输出 print，且不强制要求全量 docstring
"src/stock_cli/*" = ["T201"]               # CLI 工具允许使用控制台输出 print
"src/stock_data/validator/*" = ["T201"]    # 命令行校验器允许使用 print
"src/stock_data/ops/*" = ["T201"]          # 运维指令允许使用 print

[tool.ruff.lint.mccabe]
max-complexity = 10  # 圈复杂度上限 10

[tool.ruff.lint.pylint]
max-args = 5          # 方法参数上限 5
max-branches = 10     # 分支数上限 10
max-returns = 6       # return 语句上限 6
max-statements = 40   # 语句数上限 40
max-public-methods = 10 # 类公共方法上限 10
max-locals = 15       # 局部变量上限 15
max-nested-blocks = 5 # 嵌套块深度上限 5

[tool.mypy]
python_version = "3.12"
files = ["src"]                    # 仅强约束本项目 src 目录
strict = true                      # 开启 Mypy 严格模式
ignore_missing_imports = true      # 忽略第三方无类型存根包的干扰，只关注本项目代码
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src --cov-fail-under=75 --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src", "."]
