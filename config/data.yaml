# 全局数据源、基准与历史回填配置文件
data:
  default_benchmark_index_code: "000001"  # 交易日历基准指数代码 (上证指数)
  default_source_mode: "tushare"           # 默认主数据源 (tushare / lixinger / yfinance / fred / alphavantage)

  rate_limits:
    tushare_per_min: 180
    yfinance_per_min: 20
    lixinger_per_min: 60
    alpha_vantage_per_min: 5

  concurrency:
    tushare_max_workers: 4
    lixinger_max_workers: 2
    yfinance_max_workers: 2
    alphavantage_max_workers: 1
    default_max_workers: 4

  source_endpoint_supports:
    tushare:
      index_dailybasic:
        - "000001.SH"
        - "399001.SZ"
        - "000300.SH"
        - "000905.SH"
        - "399006.SZ"
    alphavantage:
      fx_daily:
        - "CNH=X"
    lixinger:
      index_daily_bar:
        - "000001"
        - "399001"
        - "000300"
        - "000905"
        - "000852"
        - "000985"
        - "000922"
        - "399006"
        - "000688"
      index_fundamental:
        - "000001"
        - "399001"
        - "000300"
        - "000905"
        - "000852"
        - "000985"
        - "000922"
        - "399006"
        - "000688"

  # 当前账户无权限或额度不足的接口。恢复权限后移除对应任务即可重新启用。
  disabled_endpoints:
    lixinger:
      - sw_2021_fundamental
      - sw_2021_l2_fundamental

  # 默认回填策略与参数
  backfill:
    default_start_date: "today-30d"
    default_end_date: "today"
    default_symbol: "all"
    force_refresh: false
    # TuShare 当前代理对同一 Token/IP 的并发请求有限制；财报按报告期全市场请求。
    max_workers: 4
