# 全局数据源与基准配置文件
data:
  default_benchmark_index_code: "000001"  # 交易日历基准指数代码 (上证指数)
  default_source_mode: "tushare"           # 默认主数据源 (tushare / lixinger / yfinance / mock)

  rate_limits:
    tushare_per_min: 180
    yfinance_per_min: 40
    lixinger_per_min: 30

  concurrency:
    tushare_max_workers: 4
    lixinger_max_workers: 4
    yfinance_max_workers: 4
    default_max_workers: 4

  watchlists:
    yfinance:
      stocks:
        - "AAPL"      # 苹果
        - "MSFT"      # 微软
        - "NVDA"      # 英伟达
        - "GOOGL"     # 谷歌
        - "AMZN"      # 亚马逊
        - "META"      # Meta
        - "TSLA"      # 特斯拉
      indices:
        - "^GSPC"     # 标普 500 指数
        - "^IXIC"     # 纳斯达克指数
        - "^DJI"      # 道琼斯工业指数
        - "^N225"     # 日经 225 指数 (日本)
        - "^KS11"     # 韩国 KOSPI 指数 (韩国)
        - "^HSI"      # 恒生指数 (香港)
        - "^TWII"     # 台湾加权指数 (台湾)
    tushare:
      stocks:
        - "600519.SH" # 贵州茅台
        - "000001.SZ" # 平安银行
      indices:
        - "000001.SH" # 上证指数
        - "399001.SZ" # 深证成指
    lixinger:
      stocks:
        - "600519"
        - "000001"
      indices: []
