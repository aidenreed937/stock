# 全局数据源与基准配置文件
data:
  default_benchmark_index_code: "000001"  # 交易日历基准指数代码 (上证指数)
  default_source_mode: "tushare"           # 默认主数据源 (tushare / lixinger / yfinance / mock)

  rate_limits:
    tushare_per_min: 180
    yfinance_per_min: 40
    lixinger_per_min: 30

  concurrency:
    tushare_max_workers: 4
    lixinger_max_workers: 4
    yfinance_max_workers: 4
    default_max_workers: 4

  watchlists:
    yfinance:
      stocks:
        - "AAPL"      # 苹果
        - "MSFT"      # 微软
        - "NVDA"      # 英伟达
        - "GOOGL"     # 谷歌
        - "AMZN"      # 亚马逊
        - "META"      # Meta
        - "TSLA"      # 特斯拉
      indices:
        - "^GSPC"     # 标普 500 指数
        - "^IXIC"     # 纳斯达克指数
        - "^DJI"      # 道琼斯工业指数
        - "^N225"     # 日经 225 指数 (日本)
        - "^KS11"     # 韩国 KOSPI 指数 (韩国)
        - "^HSI"      # 恒生指数 (香港)
        - "^TWII"     # 台湾加权指数 (台湾)
    tushare:
      stocks:
        - "600519.SH" # 贵州茅台
        - "000001.SZ" # 平安银行
      indices:
        - "000001.SH" # 上证指数
        - "399001.SZ" # 深证成指
        - "000300.SH" # 沪深300指数 (大盘宽基)
        - "000905.SH" # 中证500指数 (中盘宽基)
        - "000852.SH" # 中证1000指数 (小盘宽基)
        - "399006.SZ" # 创业板指 (100只龙头成分股)
        - "399102.SZ" # 创业板综 (创业板全板块综合指数)
        - "000985.CSI" # 中证全指 (全 A 股市场基准)
        - "000922.CSI" # 中证红利 (高股息率策略宽基标杆)
        - "000688.SH" # 科创50指数 (硬科技)
    lixinger:
      stocks:
        - "600519"
        - "000001"
      indices:
        - "000001" # 上证指数
        - "399001" # 深证成指
        - "000300" # 沪深300指数
        - "000905" # 中证500指数
        - "000852" # 中证1000指数
        - "399006" # 创业板指
        - "399102" # 创业板综
        - "000985" # 中证全指
        - "000922" # 中证红利
        - "000688" # 科创50
    fred:
      macro_series:
        - "FEDFUNDS"
        - "CPIAUCSL"
        - "UNRATE"
        - "PAYEMS"
        - "GDP"
        - "T10Y2Y"
        - "WALCL"

  # 接口采集模式路由表 (按标的按时间段 vs 按交易日全市场)
  endpoint_symbol_modes:
    per_symbol_endpoints:
      - "index_daily"
      - "index_dailybasic"
      - "index_weight"
      - "global_index_daily"
      - "fund_daily"
      - "history"
      - "moneyflow_hsgt"
      - "hsgt_top10"
      - "margin"
      - "cn_gdp"
      - "cn_cpi"
      - "cn_ppi"
      - "cn_pmi"
      - "cn_m"
      - "shibor_lpr"
    per_day_endpoints:
      - "daily"
      - "daily_basic"
      - "moneyflow"
      - "adj_factor"

  # 接口历史最早数据起始日校准表 (自动将更早的无意义请求截断提升至真实上线首日)
  endpoint_start_date_overrides:
    moneyflow_hsgt: "2014-11-17" # 沪港通上线首日
    hsgt_top10: "2014-11-17" # 沪港通十大成交股首日
    margin: "2010-03-31" # 融资融券首批试点上线首日

  # 数据源接口特定限制白名单 (在发起网络请求前预先拦截)
  source_endpoint_supports:
    tushare:
      index_dailybasic:
        - "000001.SH"
        - "399001.SZ"
        - "000300.SH"
        - "000905.SH"
        - "399006.SZ"
