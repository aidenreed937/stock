# 全局数据源、基准与历史回填配置文件
data:
  default_benchmark_index_code: "000001"  # 交易日历基准指数代码 (上证指数)
  default_source_mode: "tushare"           # 默认主数据源 (tushare / lixinger / yfinance / fred / alphavantage)
  yfinance_financial_probe_interval_days: 7 # yfinance 财报无新报告后的再次探测间隔（自然日）

  rate_limits:
    tushare_per_min: 180
    yfinance_per_min: 20
    lixinger_per_min: 60
    alpha_vantage_per_min: 5
    alpha_vantage_per_day: 25

  concurrency:
    source_max_workers: 3
    tushare_max_workers: 4
    lixinger_max_workers: 2
    yfinance_max_workers: 2
    alphavantage_max_workers: 1
    default_max_workers: 4

  source_endpoint_supports:
    tushare:
      index_dailybasic:
        - "000001.SH"
        - "399001.SZ"
        - "000300.SH"
        - "000905.SH"
        - "399006.SZ"
      # fut_index_daily 实际需逐个 ts_code 请求；维护当前已验证的南华指数代码池。
      fut_index_daily:
        - "A.NH"
        - "AG.NH"
        - "AL.NH"
