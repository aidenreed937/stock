# 全局数据源、基准与历史回填配置文件
data:
  default_benchmark_index_code: "000001"  # 交易日历基准指数代码 (上证指数)
  default_source_mode: "tushare"           # 默认主数据源 (tushare / lixinger / yfinance / fred)

  rate_limits:
    tushare_per_min: 180
    yfinance_per_min: 40
    lixinger_per_min: 30

  concurrency:
    tushare_max_workers: 4
    lixinger_max_workers: 4
    yfinance_max_workers: 4
    default_max_workers: 4

  # 理杏仁指数目录不包含 399102（创业板综），保留统一观察池但不提交给理杏仁任务。
  source_endpoint_supports:
    lixinger:
      index_daily_bar:
        - "000001"
        - "399001"
        - "000300"
        - "000905"
        - "000852"
        - "000985"
        - "000922"
        - "399006"
        - "000688"
      index_fundamental:
        - "000001"
        - "399001"
        - "000300"
        - "000905"
        - "000852"
        - "000985"
        - "000922"
        - "399006"
        - "000688"

  # 默认回填策略与参数
  backfill:
    default_start_date: "today-30d"
    default_end_date: "today"
    default_symbol: "all"
    force_refresh: false
    max_workers: 4
