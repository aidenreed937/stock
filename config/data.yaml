# 全局数据源与基准配置文件
data:
  default_benchmark_index_code: "000001"  # 交易日历基准指数代码 (上证指数)
  default_source_mode: "tushare"           # 默认主数据源 (tushare / lixinger / yfinance / mock)

  rate_limits:
    tushare_per_min: 180
    yfinance_per_min: 40
    lixinger_per_min: 30

  concurrency:
    tushare_max_workers: 4
    lixinger_max_workers: 4
    yfinance_max_workers: 4
    default_max_workers: 4

  watchlists:
    yfinance:
      stocks:
        - "AAPL"      # 苹果
        - "MSFT"      # 微软
        - "NVDA"      # 英伟达
        - "GOOGL"     # 谷歌
        - "AMZN"      # 亚马逊
        - "META"      # Meta
        - "TSLA"      # 特斯拉
      indices:
        - "^GSPC"     # 标普 500 指数
        - "^IXIC"     # 纳斯达克指数
        - "^DJI"      # 道琼斯工业指数
        - "^N225"     # 日经 225 指数 (日本)
        - "^KS11"     # 韩国 KOSPI 指数 (韩国)
        - "^HSI"      # 恒生指数 (香港)
        - "^TWII"     # 台湾加权指数 (台湾)
    tushare:
      stocks:
        - "600519.SH" # 贵州茅台
        - "000001.SZ" # 平安银行
      indices:
        - "000001.SH" # 上证指数
        - "399001.SZ" # 深证成指
        - "000300.SH" # 沪深300指数 (大盘宽基)
        - "000905.SH" # 中证500指数 (中盘宽基)
        - "000852.SH" # 中证1000指数 (小盘宽基)
        - "399006.SZ" # 创业板指 (100只龙头成分股)
        - "399102.SZ" # 创业板综 (创业板全板块综合指数)
        - "000985.CSI" # 中证全指 (全 A 股市场基准)
        - "000922.CSI" # 中证红利 (高股息率策略宽基标杆)
        - "000688.SH" # 科创50指数 (硬科技)
    lixinger:
      stocks:
        - "600519"
        - "000001"
      indices:
        - "000001" # 上证指数
        - "399001" # 深证成指
        - "000300" # 沪深300指数
        - "000905" # 中证500指数
        - "000852" # 中证1000指数
        - "399006" # 创业板指
        - "399102" # 创业板综
        - "000985" # 中证全指
        - "000922" # 中证红利
        - "000688" # 科创50
    fred:
      macro_series:
        - "FEDFUNDS"
        - "CPIAUCSL"
        - "UNRATE"
        - "PAYEMS"
        - "GDP"
        - "T10Y2Y"
        - "WALCL"

  # 接口采集模式路由表 (按标的按时间段 vs 按交易日全市场)
  endpoint_symbol_modes:
    per_symbol_endpoints:
      - "index_daily"
      - "index_dailybasic"
      - "index_weight"
      - "global_index_daily"
      - "fund_daily"
      - "fund_share"
      - "income"
      - "fina_indicator"
      - "margin_detail"
      - "hk_hold"
      - "sw_daily"
      - "suspend_d"
      - "history"
    per_day_endpoints:
      - "daily"
      - "daily_basic"
      - "moneyflow"
      - "adj_factor"
      - "sw_daily"

  # 接口历史最早数据起始日校准表 (自动将更早的无意义请求截断提升至真实上线首日)
  endpoint_start_date_overrides:
    moneyflow_hsgt: "2014-11-17" # 沪港通上线首日
    hsgt_top10: "2014-11-17" # 沪港通十大成交股首日
    margin: "2010-03-31" # 融资融券首批试点上线首日

  # 交易所特定业务上线首日表 (精准拦截早于交易所上线时间的无用 API 请求)
  exchange_start_dates:
    margin:
      SSE: "2010-03-31"  # 上交所两融首批试点上线首日
      SZSE: "2010-03-31" # 深交所两融首批试点上线首日
      BSE: "2023-02-13"  # 北交所两融业务正式上线首日

  # 离线存储与归档分桶配置
  storage:
    raw:
      non_partitioned_providers:
        - "fred"
        - "lixinger"
      non_partitioned_datasets:
        - "stock_basic"
        - "index_basic"
        - "index_classify"
        - "index_member"
        - "fund_basic"
        - "cn_cpi"
        - "cn_gdp"
        - "cn_ppi"
        - "cn_pmi"
        - "cn_m"
        - "sf_month"
        - "shibor_lpr"
        - "margin"
        - "moneyflow_hsgt"
        - "hsgt_top10"
        - "index_daily_bar"
        - "global_index_daily"
        - "financials"
        - "balance_sheet"
        - "cashflow"
        - "dividends"
        - "splits"
        - "index_valuation"
        - "macro_indicators"
        - "cn_index_fundamental"

  # TuShare 未回填接口全量回填目标池与参数分配配置
  backfill_targets:
    tushare:
      # 高优先级：行情与估值指标类
      - api_name: "daily_basic"
        description: "每日指标（换手率、PE、PB、总市值等）"
        fetch_mode: "per_day"
        default_start_date: "2024-01-01"
        enabled: true
      - api_name: "adj_factor"
        description: "复权因子数据"
        fetch_mode: "per_day"
        default_start_date: "2014-08-01"
        enabled: true
      - api_name: "sw_daily"
        description: "申万行业日线行情"
        fetch_mode: "per_day"
        default_start_date: "2014-08-01"
        enabled: true

      # 中优先级：北向资金与资金流向类
      - api_name: "hk_hold"
        description: "沪深港通持股明细（北向持仓）"
        fetch_mode: "per_symbol"
        default_start_date: "2014-11-17"
        enabled: true
      - api_name: "hsgt_top10"
        description: "沪深港通十大成交股"
        fetch_mode: "per_day"
        default_start_date: "2014-11-17"
        enabled: true
      - api_name: "moneyflow"
        description: "个股资金流向"
        fetch_mode: "per_day"
        default_start_date: "2024-01-01"
        enabled: true

      # 财务与基本面类
      - api_name: "income"
        description: "上市公司利润表"
        fetch_mode: "per_symbol"
        default_start_date: "2014-01-01"
        enabled: true
      - api_name: "fina_indicator"
        description: "财务指标数据（ROE/毛利率等）"
        fetch_mode: "per_symbol"
        default_start_date: "2014-01-01"
        enabled: true

      # 指数与结构类
      - api_name: "index_weight"
        description: "指数成分股权重"
        fetch_mode: "per_symbol"
        default_start_date: "2014-08-01"
        enabled: true
      - api_name: "index_member"
        description: "申万行业成分股"
        fetch_mode: "event"
        default_start_date: "2020-01-01"
        enabled: true

      # 两融明细与停复牌
      - api_name: "margin_detail"
        description: "融资融券交易明细"
        fetch_mode: "per_symbol"
        default_start_date: "2024-01-01"
        enabled: true
      - api_name: "suspend_d"
        description: "每日停复牌信息"
        fetch_mode: "per_day"
        default_start_date: "2024-01-01"
        enabled: true

      # 宏观指标类
      - api_name: "cn_ppi"
        description: "工业生产者出厂价格指数 PPI"
        fetch_mode: "event"
        default_start_date: "2014-01-01"
        enabled: true
      - api_name: "cn_pmi"
        description: "采购经理人指数 PMI"
        fetch_mode: "event"
        default_start_date: "2014-01-01"
        enabled: true
      - api_name: "cn_m"
        description: "货币供应量 M0/M1/M2"
        fetch_mode: "event"
        default_start_date: "2014-01-01"
        enabled: true
      - api_name: "sf_month"
        description: "社会融资规模"
        fetch_mode: "event"
        default_start_date: "2014-01-01"
        enabled: true

      # 基金与 ETF 类
      - api_name: "fund_basic"
        description: "基金基本信息"
        fetch_mode: "event"
        default_start_date: "2020-01-01"
        enabled: true
      - api_name: "fund_daily"
        description: "基金日线行情"
        fetch_mode: "per_symbol"
        default_start_date: "2024-01-01"
        enabled: true
      - api_name: "fund_share"
        description: "基金份额规模"
        fetch_mode: "per_symbol"
        default_start_date: "2024-01-01"
        enabled: true
