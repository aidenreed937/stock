# 历史回填策略单独配置文件
backfill:
  # 默认回填的时间段（支持动态今天 "today" 或具体日期如 "2025-08-12"）
  # 同时也支持天数偏移，例如 "today-365d" 代表今天往前 365 天
  default_start_date: "today-365d"
  default_end_date: "today"

  # 默认数据源与数据接口
  default_data_source: "tushare"
  default_endpoint: "daily"

  # 默认回填的标的范围，可选:
  # - "all" (全市场)
  # - "watchlist" (使用 config/data.yaml 中的观察池)
  # - 或者是具体的股票代码，如 "600519.SH"
  default_symbol: "all"

  # 是否开启强制刷新缓存，默认 false
  force_refresh: false

  # 单独针对回填的并发线程数控制（不设置则回退到 config/data.yaml 的线程限制）
  max_workers: 4
