  # 核心宏观时序 (FRED)
  macro:
    - "DFF" # 联邦基金有效利率（日频）
    - "FEDFUNDS" # 联邦基金有效利率月均值（历史兼容，不作利率因子输入）
    - "CPIAUCSL" # 美国 CPI
    - "UNRATE" # 失业率
    - "PAYEMS" # 非农就业人数
    - "GDP" # 美国 GDP
    - "T10Y2Y" # 10年-2年美债利差
    - "WALCL" # 美联储资产负债表规模
    - "MANEMP" # 美国制造业就业人数 (BLS)
    - "OECDLOLITOAASTSAM" # OECD 全球综合领先指标
    - "USALOLITOAASTSAM" # 美国 OECD 领先指标
    - "CHNLOLITOAASTSAM" # 中国 OECD 领先指标
    - "DGORDER" # 美国耐用品新增订单
    - "AMTMVS" # 美国制造业出货额
    - "DEXTAUS" # 美元兑新台币即期汇率 (H.10 日频)
    - "DEXKOUS" # 美元兑韩元即期汇率 (H.10 日频)
    - "DGS10" # 美国 10 年期国债收益率
    - "DGS3MO" # 美国 3 个月国债恒定期限收益率
    - "VIXCLS" # CBOE VIX 收盘值
    - "DCOILWTICO" # WTI Cushing 现货价
    - "DTWEXBGS" # 广义美元指数
    - "PCOPPUSDM" # 全球铜价（月频）
