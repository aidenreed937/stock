# 生产级股票池 (两层选股体系 Layer 1 初筛 + Layer 2 基本面精筛) 规则配置
filter_rules:
  # ===================================================================
  # 【第一层：行情与交易日风控初筛 (Layer 1 Market & Trading Filter)】
  # 基于本地 TuShare stock_basic + stock_daily_bar 数据库
  # ===================================================================
  exclude_st: true                     # 剔除 ST / *ST / 退市警示股
  min_age_days: 730                   # 至少上市满 2 年 (730 天，避开次新解禁高峰与业绩变脸)
  exclude_bj: true                    # 剔除北交所股票 (.BJ)

  # 流动性防脉冲（适度提高门槛，增强流动性保障）
  min_daily_amount_thousand: 50000.0  # 近一交易日成交额 >= 5000 万元（原 3000 万）
  min_amount_20d_thousand: 40000.0    # 20 日平均成交额 >= 4000 万元（原 3000 万）

  # 市值门槛（提高下限，进一步剔除微盘壳股，但仍保留 20-30 亿优质小盘）
  min_float_mv_yi: 20.0               # 流通市值 >= 20 亿元（原 15 亿）

  # 基础估值（PB 下限微调，更严格剔除濒临资不抵债的公司）
  min_pb: 0.5                         # 市净率 PB >= 0.5（原 0.4）
  max_pb: 8.0                         # 市净率 PB <= 8.0（保持不变，容纳周期成长股）

  # ===================================================================
  # 【第二层：财务质量与防雷精筛 (Layer 2 Fundamental Quality Filter)】
  # 基于理杏仁基本面/财务报表数据 (回填后在策略引擎中应用)
  # ===================================================================
  min_equity_yi: 5.0                  # 净资产 >= 5 亿元 (避免极小净资产导致比例失真)
  max_goodwill_to_equity: 0.3         # 商誉 / 净资产 <= 30% (防商誉减值爆雷)
  require_standard_audit: true        # 审计意见必须为标准无保留意见
  max_pledge_ratio: 0.6               # 整体质押比例 <= 60% (防高质押平仓雷)

  # 财务健康与周期防死
  require_positive_ocf: true          # 最近一期经营性现金流净额 > 0 (保证造血能力)
  max_interest_bearing_debt_ratio: 0.6 # 有息负债率 <= 60% (控制杠杆风险)

  # 行业配置与中性化预留
  industry_classification: "sw_level_1" # 申万一级行业口径
  exclude_industries: []               # 可选填 ["银行", "房地产", "非银金融"]
  industry_neutral: false              # 是否开启行业中性化配比
