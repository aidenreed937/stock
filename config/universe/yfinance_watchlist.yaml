# yfinance 外盘重点观察池配置 (按股票与指数解耦)
universe:
  stocks:
    - "AAPL"   # 苹果
    - "MSFT"   # 微软
    - "NVDA"   # 英伟达
    - "GOOGL"  # 谷歌
    - "AMZN"   # 亚马逊
    - "META"   # Meta
    - "TSLA"   # 特斯拉
  indices:
    - "^GSPC"  # 标普 500 指数
    - "^IXIC"  # 纳斯达克指数
    - "^DJI"   # 道琼斯工业指数
  # 全量组合列表
  symbols:
    - "AAPL"
    - "MSFT"
    - "NVDA"
    - "GOOGL"
    - "AMZN"
    - "META"
    - "TSLA"
    - "^GSPC"
    - "^IXIC"
    - "^DJI"
