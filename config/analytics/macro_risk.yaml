macro_risk:
  factors:
    erp:
      series: valuation
      column: erp
      window: 2500
      min_periods: 1250
      direction: rev
    pb:
      series: valuation
      column: pb
      window: 2500
      min_periods: 1250
      direction: raw
    margin_pen:
      series: leverage
      column: margin_pen
      window: 1250
      min_periods: 500
      direction: raw
    margin_buy_ratio:
      series: leverage
      column: margin_buy_ratio
      window: 1250
      min_periods: 500
      direction: raw
    main_ratio:
      series: main_flow
      column: main_ratio
      window: 1250
      min_periods: 500
      direction: rev
    composite_flow:
      series: main_flow
      column: composite_flow
      window: 1250
      min_periods: 500
      direction: rev
    etf_flow_ratio:
      # 设计说明: 本因子不进入 dim_flow，保留为独立观测。ETF 份额×收盘价口径
      # 为 T+1 早间公布、且常走降级置空路径（见 data_fetchers.py），PIT 与可信度
      # 不足以混入资金流维度（避免污染 dim_flow/panic 信号）。详见 commit 28f21e6。
      series: main_flow
      column: etf_flow_ratio
      window: 1250
      min_periods: 500
      direction: raw
    divergence_score:
      series: main_flow
      column: divergence_score
      window: 1250
      min_periods: 500
      direction: raw
      # 显式列名：默认 {factor}_score 会拼成 divergence_score_score（双 _score 后缀）
      score_column: divergence_score
    adv_dec:
      series: breadth
      column: adv_dec
      window: 1250
      min_periods: 500
      direction: rev
    newhigh60_ratio:
      series: breadth
      column: newhigh60_ratio
      window: 1250
      min_periods: 500
      direction: rev
    newlow252_ratio:
      # 设计说明: 本因子不进入 dim_breadth 与双轨指数，保留为独立观测（与
      # etf_flow_ratio / repurchase / us_yield_curve / ffr_chg_6m 同惯例）。
      # 口径: market_daily.new_low_252d_ratio 为 252 交易日滚动新低股票占比，
      # 再经 1250 日滚动分位得到 newlow252_ratio_score（0-100）。
      # direction: raw —— 新低占比越高，恐慌端出清广度越大（与 newhigh60_ratio 的
      # rev 方向互补：狂热看新高、出清看新低，两者不宜并入同一维度取均值）。
      # 定位: 补齐恐慌端广度，供研报「附加维度」与胜率实证单独解读；
      # 未经样本外验证前不写入 panic_index，避免污染双轨指数。
      # 实证: compute_cycle_winrate_matrix 的 20/60D 胜率与全样本基准无实质差异
      # （>=80 / >=90 极值分位甚至略低），故只保留观测，不升级为策略信号。
      series: breadth
      column: newlow252_ratio
      window: 1250
      min_periods: 500
      direction: raw
    pcr:
      series: pcr
      column: pcr
      window: 750
      min_periods: 250
      direction: raw
    iv:
      series: iv
      column: iv
      window: 750
      min_periods: 250
      direction: raw
    vix:
      series: vix
      column: vix
      window: 1250
      min_periods: 500
      direction: raw
    market_turnover:
      series: crowdedness
      column: market_turnover_rate
      window: 1250
      min_periods: 500
      direction: raw
    repurchase:
      # 设计说明: 本因子不进入 dim_corporate，保留为独立观测。dim_corporate 衡量
      # 产业资本/大股东增减持与解禁压力（卖出方向），repurchase 是公司回购（买入方向，
      # rev），事件驱动滚动口径，语义不同源，混入会失真维度方向解释。详见 commit 28f21e6。
      series: corporate
      column: repurchase_amount
      window: 1250
      min_periods: 250
      direction: rev
    insider_net:
      series: corporate
      column: insider_net_buy_amount
      window: 1250
      min_periods: 250
      direction: rev
    insider_sell:
      series: corporate
      column: insider_sell_amount
      window: 1250
      min_periods: 250
      direction: raw
    unlock_amount:
      series: corporate
      column: unlock_amount
      window: 1250
      min_periods: 250
      direction: raw
    cb_price:
      series: convertible_bond
      column: cb_price_median
      window: 1250
      min_periods: 250
      direction: raw
    us_yield_curve:
      # 设计说明: 本因子不进入 dim_cross_asset，保留为独立观测。年度 IC 符号跨周期
      # 正负漂移（不稳定），与 cb_price/copper_gold 的稳定负向不一致，混入会削弱
      # 维度稳定性；保留 score 列独立观测，供研报/IC 单独解读。
      series: global_macro
      column: us_yield_curve_10y_2y
      window: 1250
      min_periods: 250
      direction: rev
    copper_gold:
      # 铜价为月频，先在 global_macro_daily 中无前视 asof 到金价日历，
      # 再按月抽样；分位窗口按月计数，不使用交易日 1250/250 门槛。
      series: global_macro_monthly
      column: copper_gold_ratio
      window: 60
      min_periods: 36
      direction: raw
    ffr_chg_6m:
      # 生产口径: FRED DFF 日频利率相对六个日历月前最近观测的变化 pp，按 A 股可用日 asof。
      # 下列 IC/胜率为旧月频 FEDFUNDS 的历史研究结果，换成 DFF 后尚未复验，不能视为新口径验证。
      # 加息/降息周期方向仍为加息正、降息负；
      # 仅注册为独立观测因子，
      # 不进入 dim_cross_asset 与双轨指数。分年 IC 符号跨周期漂移（-0.75 ~ +0.57，
      # 对 000985.CSI 全周期 -0.21 / 样本外 -0.20），与 us_yield_curve 同类不稳定；
      # 但加息期 fwd60 中位 -2.58% vs 降息期 +1.68%（宽基口径）方向性正确。
      # direction: raw —— score 高 = 近 6 个月加息幅度高分位（紧缩压制期），与
      # vix/pb 等「score 高 = 风险高」口径一致；score 对后续收益为负向预测（与 vix 同号）。
      series: fed_rate
      column: ffr_chg_6m
      window: 1250
      min_periods: 250
      direction: raw
    smart_money:
      # 口径说明: smart_money_daily Mart 的 smart_money_score 已是 0-100 组合分
      # (产业资本增持/大宗折价/国家队锚点三个子分位等权合成)。本因子再经 window=250
      # 滚动分位，产物列经 score_column 命名为 smart_money_pct (组合分的分位排名,
      # 0-100 均匀分位)，避免与 Mart 原始组合分 smart_money_score 同名混淆。
      # 策略侧阈值 (smart_filter_threshold=40 / smart_support_threshold=80) 针对的是
      # smart_money_pct 分位排名口径。详见 references/smart_money_factor.md。
      series: smart_money
      column: smart_money_score
      window: 250
      min_periods: 60
      direction: raw
      score_column: smart_money_pct
  dimensions:
    valuation:
    - erp
    - pb
    leverage:
    - margin_pen
    - margin_buy_ratio
    flow:
    - main_ratio
    - composite_flow
    - divergence_score
    breadth:
    - adv_dec
    - newhigh60_ratio
    fear:
    - pcr
    - iv
    - vix
    crowding:
    - market_turnover
    corporate:
    - insider_net
    - insider_sell
    - unlock_amount
    cross_asset:
    - cb_price
    - copper_gold
    smart_money:
    - smart_money
  indices:
    overheat_index:
      - dim: valuation
        direction: raw
      - dim: leverage
        direction: raw
      - dim: fear
        direction: rev
      - dim: flow
        direction: rev
      - dim: crowding
        direction: raw
    panic_index:
      - dim: breadth
        direction: raw
      - dim: fear
        direction: raw
      - dim: flow
        direction: raw
