macro_risk:
  factors:
    erp:
      series: valuation
      column: erp
      window: 2500
      min_periods: 1250
      direction: rev
    pb:
      series: valuation
      column: pb
      window: 2500
      min_periods: 1250
      direction: raw
    margin_pen:
      series: leverage
      column: margin_pen
      window: 1250
      min_periods: 500
      direction: raw
    margin_buy_ratio:
      series: leverage
      column: margin_buy_ratio
      window: 1250
      min_periods: 500
      direction: raw
    main_ratio:
      series: main_flow
      column: main_ratio
      window: 1250
      min_periods: 500
      direction: rev
    composite_flow:
      series: main_flow
      column: composite_flow
      window: 1250
      min_periods: 500
      direction: rev
    etf_flow_ratio:
      series: main_flow
      column: etf_flow_ratio
      window: 1250
      min_periods: 500
      direction: raw
    divergence_score:
      series: main_flow
      column: divergence_score
      window: 1250
      min_periods: 500
      direction: raw
    adv_dec:
      series: breadth
      column: adv_dec
      window: 1250
      min_periods: 500
      direction: rev
    newhigh60_ratio:
      series: breadth
      column: newhigh60_ratio
      window: 1250
      min_periods: 500
      direction: rev
    pcr:
      series: pcr
      column: pcr
      window: 750
      min_periods: 250
      direction: raw
    iv:
      series: iv
      column: iv
      window: 750
      min_periods: 250
      direction: raw
    vix:
      series: vix
      column: vix
      window: 1250
      min_periods: 500
      direction: raw
    market_turnover:
      series: crowdedness
      column: market_turnover_rate
      window: 1250
      min_periods: 500
      direction: raw
    fund_issue_pct:
      series: fund_issuance
      column: fund_issue_pct5y
      window: 1250
      min_periods: 250
      direction: raw
    repurchase:
      series: corporate
      column: repurchase_amount
      window: 1250
      min_periods: 250
      direction: rev
    insider_net:
      series: corporate
      column: insider_net_buy_amount
      window: 1250
      min_periods: 250
      direction: rev
    insider_sell:
      series: corporate
      column: insider_sell_amount
      window: 1250
      min_periods: 250
      direction: raw
    unlock_amount:
      series: corporate
      column: unlock_amount
      window: 1250
      min_periods: 250
      direction: raw
    cb_price:
      series: convertible_bond
      column: cb_price_median
      window: 1250
      min_periods: 250
      direction: raw
    us_yield_curve:
      series: global_macro
      column: us_yield_curve_10y_2y
      window: 1250
      min_periods: 250
      direction: rev
    copper_gold:
      series: global_macro
      column: copper_gold_ratio
      window: 1250
      min_periods: 250
      direction: raw
    smart_money:
      # 口径说明: smart_money_daily Mart 的 smart_money_score 已是 0-100 组合分
      # (产业资本增持/大宗折价/国家队锚点三个子分位等权合成)。本因子再经 window=250
      # 滚动分位，产物列经 score_column 命名为 smart_money_pct (组合分的分位排名,
      # 0-100 均匀分位)，避免与 Mart 原始组合分 smart_money_score 同名混淆。
      # 策略侧阈值 (smart_filter_threshold=40 / smart_support_threshold=80) 针对的是
      # smart_money_pct 分位排名口径。详见 references/smart_money_factor.md。
      series: smart_money
      column: smart_money_score
      window: 250
      min_periods: 60
      direction: raw
      score_column: smart_money_pct
  dimensions:
    valuation:
    - erp
    - pb
    leverage:
    - margin_pen
    - margin_buy_ratio
    flow:
    - main_ratio
    - composite_flow
    - divergence_score
    breadth:
    - adv_dec
    - newhigh60_ratio
    fear:
    - pcr
    - iv
    - vix
    euphoria:
    - fund_issue_pct
    crowding:
    - market_turnover
    corporate:
    - insider_net
    - insider_sell
    - unlock_amount
    cross_asset:
    - cb_price
    - us_yield_curve
    - copper_gold
    smart_money:
    - smart_money
  indices:
    overheat_index:
      - dim: valuation
        direction: raw
      - dim: leverage
        direction: raw
      - dim: fear
        direction: rev
      - dim: flow
        direction: rev
      - dim: crowding
        direction: raw
    panic_index:
      - dim: breadth
        direction: raw
      - dim: fear
        direction: raw
      - dim: flow
        direction: raw
