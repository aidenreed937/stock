market_temperature:
  schema_version: 1
  title: "A 股六维市场温度计"
  artifact_root: "data/analytics/market_temperature"
  main_window: 20
  short_windows: [5, 10]

  metric_values:
    enabled: true

  domain_mart_observations_enabled: true

  bands:
    temperature_levels:
      low_opportunity: 20.0
      cool_observation: 40.0
      neutral_rotation: 60.0
      warm_recovery: 80.0
    pressure_levels:
      moderate: 40.0
      high_moderate: 60.0
      high: 80.0
    delta_levels:
      stable: 3.0
      moderate: 5.0
      significant: 20.0

  external_risk:
    background_pressure_metric_id: macro_external_pressure_temperature
    environment_temperature_metric_id: macro_external_environment_temperature
    shock:
      min_trigger_count: 1
      rules:
        - metric_id: macro_sp500_1d_return
          operator: lte
          threshold: -0.01
          label: "标普500"
        - metric_id: macro_nasdaq_1d_return
          operator: lte
          threshold: -0.01
          label: "纳斯达克"
        - metric_id: macro_sox_1d_return
          operator: lte
          threshold: -0.03
          label: "费城半导体"
        - metric_id: macro_vix_1d_change
          operator: gte
          threshold: 0.03
          label: "VIX"
        - metric_id: macro_us_10y_1d_change
          operator: gte
          threshold: 0.05
          label: "美债10年期收益率"
    transmission_status_on_shock: pending_next_ashare_session
    transmission_status_without_shock: not_applicable
    transmission_status_insufficient: insufficient_external_data
    message_on_shock: "外盘短线冲击已出现，等待下一交易日 A 股确认。"
    message_without_shock: "当前未检测到配置阈值触发的外盘短线冲击。"
    message_insufficient: "外盘单日冲击数据不足，暂不能判断。"
    observation_focus:
      - "科技成长"
      - "两融"
      - "主力净流入"
      - "上涨行业扩散"

  dimensions:
    - id: valuation
      name: "估值面"
      weight: 0.20
      role: "估值水位与股债性价比"
      metrics:
        - metric_id: valuation_temperature
          aggregation: mean
          direction: positive
          weight: 1.00
        - metric_id: pe_percentile_10y
          aggregation: mean
          direction: positive
          weight: 0.00
        - metric_id: pb_percentile_10y
          aggregation: mean
          direction: positive
          weight: 0.00
        - metric_id: equity_risk_premium_percentile_10y
          aggregation: mean
          direction: inverse
          weight: 0.00

    - id: fund_flow
      name: "资金面"
      weight: 0.20
      role: "杠杆资金、主力资金与成交活跃度"
      metrics:
        - metric_id: margin_buy_share
          aggregation: latest
          direction: positive
          weight: 0.00
        - metric_id: margin_buy_share_zscore_60d
          aggregation: latest
          direction: positive
          weight: 0.25
        - metric_id: margin_penetration
          aggregation: latest
          direction: positive
          weight: 0.00
        - metric_id: margin_penetration_percentile_1250d
          aggregation: latest
          direction: positive
          weight: 0.20
        - metric_id: margin_balance_growth_20d
          aggregation: latest
          direction: positive
          weight: 0.20
        - metric_id: margin_balance_growth_60d
          aggregation: latest
          direction: positive
          weight: 0.00
        - metric_id: main_money_net_inflow_share
          aggregation: latest
          direction: positive
          weight: 0.10
        - metric_id: main_money_net_inflow_share_20d_cum
          aggregation: latest
          direction: positive
          weight: 0.10
        - metric_id: market_amount_percentile_1250d
          aggregation: latest
          direction: positive
          weight: 0.00

    - id: sentiment
      name: "情绪面"
      weight: 0.15
      role: "换手、上涨扩散和交易热度"
      metrics:
        - metric_id: turnover_rate_percentile_1250d
          aggregation: latest
          direction: positive
          weight: 0.40
          subgroup: activity
        - metric_id: market_turnover_rate
          aggregation: latest
          direction: positive
          weight: 0.00
          subgroup: activity
        - metric_id: advance_share
          aggregation: latest
          direction: positive
          weight: 0.25
        - metric_id: limit_event_temperature
          source: derived
          direction: positive
          weight: 0.25
        - metric_id: investor_account_temperature
          source: derived
          direction: positive
          weight: 0.10
          subgroup: slow
        - metric_id: limit_up_count_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: limit_down_count_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: limit_up_down_strength_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: limit_seal_success_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: option_risk_temperature
          source: derived
          direction: positive
          weight: 0.00
          subgroup: activity
        - metric_id: option_put_call_volume_ratio_temperature
          source: derived
          direction: positive
          weight: 0.00
          subgroup: activity
        - metric_id: option_put_call_oi_ratio_temperature
          source: derived
          direction: positive
          weight: 0.00
          subgroup: activity
        - metric_id: option_amount_temperature
          source: derived
          direction: positive
          weight: 0.00
          subgroup: activity
        - metric_id: option_open_interest_temperature
          source: derived
          direction: positive
          weight: 0.00
          subgroup: activity
        - metric_id: option_near_month_amount_share_temperature
          source: derived
          direction: positive
          weight: 0.00
          subgroup: activity
        - metric_id: settlement_iv_proxy_temperature
          source: derived
          direction: positive
          weight: 0.00
          subgroup: activity
        - metric_id: settlement_iv_proxy_skew_temperature
          source: derived
          direction: positive
          weight: 0.00
          subgroup: activity

    - id: technical
      name: "技术面"
      weight: 0.15
      role: "趋势、动量、广度与超买超卖"
      metrics:
        - metric_id: return_20d
          aggregation: median
          direction: positive
          weight: 0.20
        - metric_id: rsi_14d
          aggregation: median
          direction: positive
          weight: 0.20
        - metric_id: ma_bias_20d
          aggregation: median
          direction: positive
          weight: 0.15
        - metric_id: above_ma20_share
          aggregation: latest
          direction: positive
          weight: 0.20
        - metric_id: above_ma60_share
          aggregation: latest
          direction: positive
          weight: 0.15
        - metric_id: new_high_share_252d
          aggregation: latest
          direction: positive
          weight: 0.05
        - metric_id: new_low_share_252d
          aggregation: latest
          direction: inverse
          weight: 0.05

    - id: fundamental
      name: "基本面"
      weight: 0.15
      role: "季频盈利底座与最近预期变化"
      stale_after_days: 90
      stale_weight_scale: 0.40
      metrics:
        - metric_id: fs_revenue_growth_temperature
          source: derived
          direction: positive
          weight: 0.20
        - metric_id: fs_profit_growth_temperature
          source: derived
          direction: positive
          weight: 0.25
        - metric_id: fs_roe_temperature
          source: derived
          direction: positive
          weight: 0.10
        - metric_id: forecast_positive_temperature
          source: derived
          direction: positive
          weight: 0.20
        - metric_id: report_revision_temperature
          source: derived
          direction: positive
          weight: 0.25

    - id: macro_liquidity
      name: "宏观流动性"
      weight: 0.15
      role: "利率、货币信用与外部流动性状态"
      metrics:
        - metric_id: equity_bond_yield_ratio
          aggregation: mean
          direction: inverse
          weight: 0.00
        - metric_id: dividend_bond_spread
          aggregation: mean
          direction: inverse
          weight: 0.00
        - metric_id: macro_bond_yield_10y_temperature
          source: derived
          direction: positive
          weight: 0.18
        - metric_id: macro_shibor_on_temperature
          source: derived
          direction: positive
          weight: 0.12
        - metric_id: macro_real_rate_temperature
          source: derived
          direction: positive
          weight: 0.10
        - metric_id: macro_m2_yoy_temperature
          source: derived
          direction: positive
          weight: 0.08
        - metric_id: macro_m1_m2_gap_temperature
          source: derived
          direction: positive
          weight: 0.06
        - metric_id: macro_social_finance_stock_temperature
          source: derived
          direction: positive
          weight: 0.06
        - metric_id: macro_external_environment_temperature
          source: derived
          direction: positive
          weight: 0.40
        - metric_id: macro_sp500_20d_return_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_nasdaq_20d_return_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_usd_index_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_usd_index_20d_change_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_vix_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_us_10y_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_copper_20d_return_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_gold_20d_return_pressure
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_oil_20d_return_pressure
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_safe_haven_pressure_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_inflation_pressure_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_demand_pressure_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_external_pressure_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_sp500_1d_return
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_nasdaq_1d_return
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_sox_1d_return
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_vix_1d_change
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_us_10y_1d_change
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_cnh_20d_change_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_fred_t10y2y_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_fred_fedfunds_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_fred_walcl_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_fred_cpi_yoy_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_fred_unrate_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_fred_payems_yoy_temperature
          source: derived
          direction: positive
          weight: 0.00
        - metric_id: macro_fred_gdp_yoy_temperature
          source: derived
          direction: positive
          weight: 0.00

  datasets:
    - data_source: tushare
      dataset: stock_daily_bar
      dimension: technical
      required: true
      max_lag_days: 0
      cadence: trading_daily
      quality_tier: core
      note: "A 股全市场日 K，20 日主窗口锚点"
    - data_source: tushare
      dataset: daily_basic
      dimension: valuation
      required: true
      max_lag_days: 0
      cadence: trading_daily
      quality_tier: core
      note: "全市场估值、换手率与成交活跃度"
    - data_source: tushare
      dataset: margin
      dimension: fund_flow
      required: false
      max_lag_days: 2
      cadence: trading_daily
      quality_tier: confirming
      note: "融资融券余额与融资买入"
    - data_source: tushare
      dataset: moneyflow
      dimension: fund_flow
      required: false
      max_lag_days: 2
      cadence: trading_daily
      quality_tier: confirming
      note: "个股资金流，通常晚于行情一个交易日"
    - data_source: tushare
      dataset: moneyflow_hsgt
      dimension: fund_flow
      required: false
      max_lag_days: 3
      cadence: trading_daily
      quality_tier: confirming
      note: "北向资金相关字段，输出需披露字段语义限制"
    - data_source: tushare
      dataset: stk_limit
      dimension: sentiment
      required: false
      max_lag_days: 1
      cadence: trading_daily
      quality_tier: background
      note: "每日涨跌停价格表，只作为价格上下限支撑，不等同涨跌停事件"
    - data_source: tushare
      dataset: limit_list_d
      dimension: sentiment
      required: false
      max_lag_days: 1
      cadence: trading_daily
      quality_tier: confirming
      note: "涨跌停和炸板事件表，用于涨停/跌停/炸板情绪温度"
    - data_source: tushare
      dataset: opt_basic
      dimension: sentiment
      required: false
      static: true
      cadence: static
      quality_tier: background
      note: "期权静态合约表；用于期权成交风险观察，未计算隐含波动率"
    - data_source: tushare
      dataset: opt_daily
      dimension: sentiment
      required: false
      max_lag_days: 5
      cadence: trading_daily
      quality_tier: background
      note: "期权日行情；用于PCR、成交额、持仓和近月合约热度观察，不进入主温度"
    - data_source: tushare
      dataset: forecast
      dimension: fundamental
      required: false
      date_column: ann_date
      cadence: event
      quality_tier: confirming
      in_score: true
      note: "业绩预告，作为最近 20 日基本面事件补充"
    - data_source: tushare
      dataset: report_rc
      dimension: fundamental
      required: false
      date_column: report_date
      cadence: event
      quality_tier: confirming
      in_score: true
      note: "分析师盈利预测，作为预期上修/下修补充"
    - data_source: lixinger
      dataset: index_fundamental
      dimension: valuation
      required: true
      max_lag_days: 2
      cadence: trading_daily
      quality_tier: core
      note: "核心指数估值与股息率"
    - data_source: lixinger
      dataset: national_debt
      dimension: macro_liquidity
      required: true
      max_lag_days: 7
      cadence: trading_daily
      quality_tier: core
      note: "中国国债收益率，股债性价比依赖"
    - data_source: lixinger
      dataset: sw_2021_fundamental
      dimension: fundamental
      required: false
      max_lag_days: 7
      cadence: trading_daily
      quality_tier: confirming
      note: "申万一级行业估值，基本面底座"
    - data_source: lixinger
      dataset: sw_2021_fs_non_financial
      dimension: fundamental
      required: false
      max_lag_days: 90
      cadence: quarterly
      quality_tier: slow
      in_score: true
      note: "非金融行业季频财报"
    - data_source: lixinger
      dataset: sw_2021_fs_bank
      dimension: fundamental
      required: false
      max_lag_days: 90
      cadence: quarterly
      quality_tier: slow
      in_score: true
      note: "银行行业季频财报"
    - data_source: lixinger
      dataset: sw_2021_fs_security
      dimension: fundamental
      required: false
      max_lag_days: 90
      cadence: quarterly
      quality_tier: slow
      in_score: true
      note: "证券行业季频财报"
    - data_source: lixinger
      dataset: sw_2021_fs_insurance
      dimension: fundamental
      required: false
      max_lag_days: 90
      cadence: quarterly
      quality_tier: slow
      in_score: true
      note: "保险行业季频财报"
    - data_source: lixinger
      dataset: investor_accounts
      dimension: sentiment
      required: false
      date_column: trade_date
      max_lag_days: 60
      cadence: monthly
      quality_tier: slow
      in_score: true
      note: "月度新增投资者账户，用于情绪面慢变量"
    - data_source: tushare
      dataset: shibor
      dimension: macro_liquidity
      required: false
      max_lag_days: 3
      cadence: trading_daily
      quality_tier: confirming
      note: "银行间短端资金价格"
    - data_source: lixinger
      dataset: cn_m
      dimension: macro_liquidity
      required: false
      date_column: month
      max_lag_days: 60
      cadence: monthly
      quality_tier: slow
      in_score: true
      note: "M1/M2 月度货币数据"
    - data_source: lixinger
      dataset: sf_month
      dimension: macro_liquidity
      required: false
      date_column: month
      max_lag_days: 60
      cadence: monthly
      quality_tier: slow
      in_score: true
      note: "社融月度数据"
    - data_source: tushare
      dataset: cn_cpi
      dimension: macro_liquidity
      required: false
      date_column: month
      max_lag_days: 60
      cadence: monthly
      quality_tier: slow
      in_score: true
      note: "中国 CPI 月度数据"
    - data_source: yfinance
      dataset: index_daily_bar
      dimension: macro_liquidity
      required: false
      max_lag_days: 3
      cadence: trading_daily
      quality_tier: confirming
      note: "标普500、纳斯达克等外盘指数历史行情，用于外部环境收益分位"
    - data_source: yfinance
      dataset: macro_indicators
      dimension: macro_liquidity
      required: false
      max_lag_days: 3
      cadence: trading_daily
      quality_tier: confirming
      note: "VIX、美元、美债、铜等外部环境代理；黄金和原油用于外部压力观察"
    - data_source: alphavantage
      dataset: macro_indicators
      dimension: macro_liquidity
      required: false
      max_lag_days: 3
      cadence: trading_daily
      quality_tier: background
      note: "Alpha Vantage USD/CNH 外汇日线，用于人民币汇率压力观察项"
    - data_source: fred
      dataset: macro_indicators
      dimension: macro_liquidity
      required: false
      max_lag_days: 14
      cadence: mixed
      quality_tier: background
      note: "FRED 美国官方宏观背景，日频/周频/月频/季频混合；只作观察项"
