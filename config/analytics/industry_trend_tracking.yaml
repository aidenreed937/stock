# 申万行业产业趋势跟踪因子面板配置
# 面向周期尺度（季度/半年）全球产业趋势的确认与跟踪，非 A 股内部轮动博弈。

schema_version: 1
title: "申万行业产业趋势跟踪因子面板"
artifact_root: "data/analytics/industry_trend"

# 产业趋势量化框架（深研线簇·产业腿激活 × 财报滞后验证 × 动量兜底）+ 现实景气 + 拥挤度防守 的面板合成权重。
# 默认权重精确对齐已验证 milestone：现实景气 2/3 + 拥挤度防守 1/3（样本外 Sharpe ≈ 0.39）；
# 注：该 composite 仅作面板列/事后确认，实盘选股=深研线簇（有腿行业剪刀差 LONG + DOI 激活）+ 无腿行业 return_60d 动量兜底。
# 财报滞后验证（supply_demand/bargaining，量价齐升/毛利率扩张）默认权重 0，不作前瞻选股；全球方向（direction_score）仅作可选加权（当前 0）。
weights:
  direction: 0.0        # 全球资本开支方向（可选加权，不作判定层；数据现状）
  supply_demand: 0.0    # 财报滞后验证 · 量价齐升（营收+净利双正，事后验证供需兑现）
  bargaining: 0.0       # 财报滞后验证 · 毛利率扩张（净利增速>营收增速，事后验证定价权）
  prosperity: 0.6667    # 现实景气（业绩预告/快报）
  crowding: 0.3333      # 拥挤度防守（减分项）

# 环比趋势确认窗口（季度交易日数）
trend_lookback: 63

# 财报滞后验证 · 量价齐升 质量分参数
supply_contract_penalty: 20.0   # 供给收缩（营收负、净利正）质量分
double_negative_penalty: 10.0   # 双负（营收负、净利负）质量分

# 财报滞后验证 · 毛利率扩张 中性分（量价齐升门外的行业不参与毛利率扩张评分）
bargaining_neutral: 30.0

# 方向层中性分（全球共振数据缺失时的默认值）
direction_neutral: 50.0

# 方向层防守门（实证：SOX 高位 × 非量价齐升 是风险象限，未来 60 日 -1.61% vs 量价齐升 +3.13%）
# 对比实验（2026-08-30）：因子层减分伤样本外（0.35 vs baseline 0.39），
# 策略层象限过滤更优（全周期 0.46 / 样本外 0.39）→ 因子层防守门默认关闭，由策略层过滤承担。
direction_high_threshold: 66.0   # 方向分高位阈值（>66 视为过热）
direction_risk_penalty: 20.0     # 高位 × 非量价齐升 的 composite 减分（因子层，默认关闭）
direction_defensive_gate: false  # 因子层防守门开关（默认关闭，改由策略层象限过滤）

# 资本开支朱格拉周期先导与库存剪刀差参数
capex_leading:
  cip_expansion_threshold: 20.0    # 在建工程同比 > 20% 视为产能扩张先导
  cip_to_fa_high_ratio: 0.35       # 在建/固资比 > 35% 视为潜在产能投放高张力
  capex_growth_expansion: 15.0     # 现金流 Capex TTM 增速 > 15% 视为实体投资扩张
