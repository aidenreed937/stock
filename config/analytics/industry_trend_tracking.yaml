# 申万行业产业趋势跟踪因子面板配置
# 面向周期尺度（季度/半年）全球产业趋势的确认与跟踪，非 A 股内部轮动博弈。

schema_version: 1
title: "申万行业产业趋势跟踪因子面板"
artifact_root: "data/analytics/industry_trend"

# 三层共振框架（方向×供需×议价权）+ 现实景气 + 拥挤度防守 的合成权重。
# 默认权重精确对齐已验证 milestone：现实景气 2/3 + 拥挤度防守 1/3（样本外 Sharpe ≈ 0.39）。
# 三层框架因子默认权重 0，待全球共振数据（direction_score）补齐、供需/议价权验证后激活。
weights:
  direction: 0.0        # 全球资本开支方向（数据缺口）
  supply_demand: 0.0    # 量价齐升质量（需求驱动 > 供给收缩）
  bargaining: 0.0       # 议价权（毛利率扩张）
  prosperity: 0.6667    # 现实景气（业绩预告/快报）
  crowding: 0.3333      # 拥挤度防守（减分项）

# 环比趋势确认窗口（季度交易日数）
trend_lookback: 63

# 供需层质量分参数
supply_contract_penalty: 20.0   # 供给收缩（营收负、净利正）质量分
double_negative_penalty: 10.0   # 双负（营收负、净利负）质量分

# 议价权层中性分（量价齐升门外的行业不参与毛利率扩张评分）
bargaining_neutral: 30.0

# 方向层中性分（全球共振数据缺失时的默认值）
direction_neutral: 50.0
