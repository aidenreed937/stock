industry_structure:
  schema_version: 1
  title: "申万行业结构分析"
  artifact_root: "data/analytics/industry_structure"
  main_window: 20
  short_windows: [5, 10]
  medium_windows: [60, 120]
  classification: "SW2021"
  benchmark: "000985.CSI"

  score_weights:
    momentum: 0.40
    valuation: 0.25
    fundamental: 0.15
    crowding: 0.20

  fundamental_blend:
    stale_after_days: 90
    official_weight: 0.70
    fast_weight: 0.30
    stale_official_weight: 0.40
    stale_fast_weight: 0.60

  thresholds:
    crowded_threshold: 20.0
    weak_fundamental_score: 40.0
    breadth_share20_strong: 0.60
    breadth_share60_weak: 0.35
    breadth_share60_healthy: 0.50
    score_top_structure: 75.0
    score_crowded_risk: 70.0
    score_lagging: 60.0

  datasets:
    - data_source: tushare
      dataset: sw_daily
      required: true
      max_lag_days: 0
      cadence: trading_daily
      quality_tier: core
      note: "申万行业指数行情，行业动量和成交拥挤度主数据"
    - data_source: tushare
      dataset: index_classify
      required: false
      static: true
      cadence: static
      quality_tier: core
      note: "申万行业分类字典，用于识别 SW2021 一级行业"
    - data_source: tushare
      dataset: index_daily_bar
      required: false
      max_lag_days: 3
      cadence: trading_daily
      quality_tier: confirming
      note: "宽基指数行情，用于行业相对收益基准；缺失时回退为行业中位数"
    - data_source: tushare
      dataset: index_member_versioned
      required: false
      static: true
      cadence: static
      quality_tier: core
      note: "版本化申万行业成份股映射，默认筛选 SW2021，用于把预告、快报和研报关联到行业"
    - data_source: derived
      dataset: sw_2021_industry_member_golden
      required: false
      static: true
      cadence: static
      quality_tier: core
      note: "TuShare/LiXinger 申万2021跨源成员黄金表；存在时优先用于当前截面与冲突审计"
    - data_source: tushare
      dataset: stock_daily_bar
      required: false
      max_lag_days: 0
      cadence: trading_daily
      quality_tier: confirming
      note: "A股个股成交额，用作行业资金流净流入占比分母"
    - data_source: tushare
      dataset: moneyflow
      required: false
      cadence: trading_daily
      quality_tier: confirming
      note: "个股资金流可用时点可能晚于行情；按实际 moneyflow_date 聚合为行业资金确认观察项，不进入结构总分"
    - data_source: tushare
      dataset: forecast
      required: false
      date_column: ann_date
      cadence: event
      quality_tier: confirming
      note: "业绩预告，用于快速基本面确认"
    - data_source: tushare
      dataset: express
      required: false
      date_column: ann_date
      cadence: event
      quality_tier: confirming
      note: "业绩快报，用于快速基本面确认"
    - data_source: tushare
      dataset: report_rc
      required: false
      date_column: report_date
      cadence: event
      quality_tier: confirming
      note: "卖方盈利预测，用于快速基本面确认"
    - data_source: lixinger
      dataset: sw_2021_fundamental
      required: false
      max_lag_days: 7
      cadence: trading_daily
      quality_tier: confirming
      note: "申万2021一级行业估值"
    - data_source: lixinger
      dataset: sw_2021_constituents
      required: false
      static: true
      cadence: static
      quality_tier: confirming
      note: "申万2021行业成份股图谱，用于补充快速基本面行业映射"
    - data_source: lixinger
      dataset: sw_2021_fs_non_financial
      required: false
      max_lag_days: 90
      cadence: quarterly
      quality_tier: slow
      note: "申万2021非金融行业季频财报"
    - data_source: lixinger
      dataset: sw_2021_fs_bank
      required: false
      max_lag_days: 90
      cadence: quarterly
      quality_tier: slow
      note: "申万2021银行行业季频财报"
    - data_source: lixinger
      dataset: sw_2021_fs_security
      required: false
      max_lag_days: 90
      cadence: quarterly
      quality_tier: slow
      note: "申万2021证券行业季频财报"
    - data_source: lixinger
      dataset: sw_2021_fs_insurance
      required: false
      max_lag_days: 90
      cadence: quarterly
      quality_tier: slow
      note: "申万2021保险行业季频财报"
    - data_source: tushare
      dataset: balancesheet
      required: false
      max_lag_days: 90
      cadence: quarterly
      quality_tier: core
      note: "资产负债表，用于自底向上汇总在建工程与固定资产以计算资本开支先导指标"
    - data_source: tushare
      dataset: cashflow
      required: false
      max_lag_days: 90
      cadence: quarterly
      quality_tier: core
      note: "现金流量表，用于自底向上汇总真实购建固资现金流以计算 Capex TTM 增速"
