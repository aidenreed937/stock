stock_screen:
  schema_version: 1
  title: "个股排雷（全市场硬性剔除与黄牌预警）"
  artifact_root: "data/analytics/stock_screen"
  as_of: null
  symbols: []

  hard_exclusion:
    rules:
      - id: st_marked
        enabled: true
        scope: all_market
        params:
          name_regex: "ST|\\*ST|退"
        note: "stock_basic.name 正则可识别 ST/*ST/退市整理"
      - id: too_new_listing
        enabled: true
        scope: all_market
        params:
          min_list_days: 180
        note: "stock_basic.list_date 距 as_of 不足 180 天"
      - id: penny_stock_face_value
        enabled: true
        scope: all_market
        params:
          min_close_price: 2.0
        note: "daily_basic.close"
      - id: illiquid_float
        enabled: true
        scope: all_market
        params:
          min_daily_amount_yuan: 50000000.0
        note: "stock_daily_bar.amount（daily_basic 无 amount 字段）"
      - id: consecutive_losses
        enabled: true
        scope: all_market
        params:
          loss_years: 2
          report_lag_days: 120
        note: "income.n_income / fina_indicator 按 ann_date<=as_of 取最新"
      - id: negative_equity
        enabled: true
        scope: all_market
        params:
          min_total_equity: 0.0
        note: "balancesheet.total_hldr_eqy_exc_min_int"
      - id: goodwill_overhang
        enabled: true
        scope: all_market
        params:
          max_goodwill_to_equity: 0.50
        note: "balancesheet.goodwill / total_hldr_eqy_exc_min_int"
      - id: suspended
        enabled: true
        scope: all_market
        params:
          require_trade_on_as_of: true
        note: "stock_daily_bar 当日缺行 / suspend_d"

  yellow_warn:
    rules:
      - id: forecast_plunge
        enabled: true
        scope: all_market
        params:
          p_change_min_threshold: -50.0
        note: "forecast 按 ann_date PIT 生效；仅覆盖披露预告公司"
      - id: holder_selloff
        enabled: true
        scope: all_market
        params:
          window_days: 180
          min_sell_count: 3
        note: "stk_holdertrade in_de=DE，按 begin_date/close_date 计数"
      - id: goodwill_observe
        enabled: true
        scope: all_market
        params:
          observe_ratio: 0.30
        note: "低于 0.50 硬剔除线，仅观察"
      - id: northbound_drawdown
        enabled: true
        scope: northbound
        params:
          window_days: 20
          drop_threshold: -0.20
        note: "hk_hold 持仓 20 日降幅 > 20%"
      - id: consecutive_limit_down
        enabled: true
        scope: all_market
        params:
          min_consecutive_count: 2
        note: "limit_list_d 连续跌停"
      - id: margin_stress
        enabled: false
        scope: all_market
        params:
          window_days: 20
          drop_threshold: -0.30
        note: "margin_detail 当前仅覆盖 watchlist，无法执行全市场排雷"
      - id: pledge_overhang
        enabled: false
        scope: all_market
        params:
          max_pledge_ratio: 0.70
        note: "lixinger/pledge_info 仅少量快照，数据不足"
      - id: block_trade_discount
        enabled: false
        scope: all_market
        params:
          max_discount: -0.10
        note: "block_trade 事件型，第二期接入"

  output:
    top_passed: 100
    max_warn_rows: 500

  datasets:
    - data_source: tushare
      dataset: stock_basic
      required: true
      static: true
      cadence: static
      quality_tier: core
      note: "全市场股票基础资料与上市日期"
    - data_source: tushare
      dataset: stock_daily_bar
      required: true
      max_lag_days: 0
      cadence: trading_daily
      quality_tier: core
      note: "个股行情与成交额"
    - data_source: tushare
      dataset: daily_basic
      required: true
      max_lag_days: 0
      cadence: trading_daily
      quality_tier: core
      note: "收盘价及每日估值"
    - data_source: tushare
      dataset: income
      max_lag_days: 120
      date_column: ann_date
      cadence: quarterly
      quality_tier: core
      note: "利润表 PIT 数据"
    - data_source: tushare
      dataset: fina_indicator
      max_lag_days: 120
      date_column: ann_date
      cadence: quarterly
      quality_tier: confirming
      note: "财务指标备用数据"
    - data_source: tushare
      dataset: balancesheet
      max_lag_days: 120
      date_column: ann_date
      cadence: quarterly
      quality_tier: core
      note: "净资产与商誉"
    - data_source: tushare
      dataset: forecast
      date_column: ann_date
      cadence: event
      quality_tier: confirming
      note: "业绩预告 PIT 数据"
    - data_source: tushare
      dataset: stk_holdertrade
      date_column: ann_date
      cadence: event
      quality_tier: confirming
      note: "股东及董监高增减持事件"
    - data_source: tushare
      dataset: hk_hold
      date_column: trade_date
      cadence: trading_daily
      quality_tier: confirming
      note: "北向个股持仓，仅对北向标的评估"
    - data_source: tushare
      dataset: limit_list_d
      date_column: trade_date
      cadence: event
      quality_tier: confirming
      note: "连续跌停事件"
    - data_source: tushare
      dataset: suspend_d
      date_column: suspend_date
      cadence: event
      quality_tier: confirming
      note: "停牌事件辅助确认"
    - data_source: tushare
      dataset: margin_detail
      enabled: false
      cadence: trading_daily
      quality_tier: optional
      note: "仅 watchlist，规则关闭"
    - data_source: lixinger
      dataset: pledge_info
      enabled: false
      cadence: event
      quality_tier: optional
      note: "覆盖不足，规则关闭"
