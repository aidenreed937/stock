stock_screen:
  schema_version: 1
  title: "个股排雷（全市场硬性剔除与黄牌预警）"
  artifact_root: "data/analytics/stock_screen"
  as_of: null
  symbols: []

  hard_exclusion:
    rules:
      - id: st_marked
        enabled: true
        scope: all_market
        params:
          name_regex: "ST|\\*ST|退"
        note: "stock_basic.name 正则可识别 ST/*ST/退市整理"
      - id: too_new_listing
        enabled: true
        scope: all_market
        params:
          min_list_days: 180
        note: "stock_basic.list_date 距 as_of 不足 180 天"
      - id: penny_stock_face_value
        enabled: true
        scope: all_market
        params:
          min_close_price: 2.0
        note: "daily_basic.close"
      - id: illiquid_float
        enabled: true
        scope: all_market
        params:
          min_daily_amount_yuan: 50000000.0
        note: "stock_daily_bar.amount（daily_basic 无 amount 字段）"
      - id: consecutive_losses
        enabled: true
        scope: all_market
        params:
          loss_years: 2
          report_lag_days: 120
        note: "income.n_income / fina_indicator 按 ann_date<=as_of 取最新"
      - id: negative_equity
        enabled: true
        scope: all_market
        params:
          min_total_equity: 0.0
        note: "balancesheet.total_hldr_eqy_exc_min_int"
      - id: goodwill_overhang
        enabled: true
        scope: all_market
        params:
          max_goodwill_to_equity: 0.50
        note: "balancesheet.goodwill / total_hldr_eqy_exc_min_int"
      - id: suspended
        enabled: true
        scope: all_market
        params:
          require_trade_on_as_of: true
        note: "stock_daily_bar 当日缺行 / suspend_d"

  yellow_warn:
    rules:
      - id: forecast_plunge
        enabled: true
        scope: all_market
        params:
          p_change_min_threshold: -50.0
        note: "forecast 按 ann_date PIT 生效；仅覆盖披露预告公司"
      - id: holder_selloff
        enabled: true
        scope: all_market
        params:
          window_days: 180
          min_sell_count: 3
        note: "stk_holdertrade in_de=DE，按 begin_date/close_date 计数"
      - id: goodwill_observe
        enabled: true
        scope: all_market
        params:
          observe_ratio: 0.30
        note: "低于 0.50 硬剔除线，仅观察"
      - id: northbound_drawdown
        enabled: true
        scope: northbound
        params:
          window_days: 20
          drop_threshold: -0.20
        note: "hk_hold 持仓 20 日降幅 > 20%"
      - id: consecutive_limit_down
        enabled: true
        scope: all_market
        params:
          min_consecutive_count: 2
        note: "limit_list_d 连续跌停"
      - id: margin_stress
        enabled: true
        scope: all_market
        params:
          window_days: 20
          drop_threshold: -0.30
        note: "margin_detail 全市场 4400+ 标的，评估融资融券余额 20 日骤降 > 30%"
      - id: dedt_profit_loss
        enabled: true
        scope: all_market
        params:
          loss_years: 2
        note: "fina_indicator.profit_dedt 连续扣非亏损（主业空心化风险）"
      - id: lockup_release
        enabled: true
        scope: all_market
        params:
          forward_days: 60
          max_float_ratio: 10.0
        note: "share_float 未来 60 天限售解禁比例 >= 10%"
      - id: pledge_overhang
        enabled: true
        scope: all_market
        params:
          max_pledge_ratio: 0.50
        note: "pledge_detail 未解质押持股比例 >= 50%"
      - id: high_leverage_insolvency
        enabled: true
        scope: all_market
        params:
          max_debt_to_assets: 85.0
          min_current_ratio: 0.8
        note: "fina_indicator.debt_to_assets 畸高且流动比率过低"
      - id: receivables_revenue_distortion
        enabled: true
        scope: all_market
        params:
          max_receivables_ratio: 0.80
        note: "balancesheet.accounts_receiv / income.revenue 应收账款占营收 >= 80%"
      - id: block_trade_discount
        enabled: true
        scope: all_market
        params:
          window_days: 30
          min_total_amount: 20000000.0
        note: "block_trade 近 30 天大宗交易大额套现"
      - id: consecutive_ocf_deficit
        enabled: true
        scope: all_market
        params:
          loss_years: 2
        note: "cashflow.n_cashflow_act 经营现金流连续净流出"

  output:
    top_passed: 100
    max_warn_rows: 500

  scoring:
    enabled: true
    top_n: 100

  datasets:
    - data_source: tushare
      dataset: stock_basic
      required: true
      static: true
      cadence: static
      quality_tier: core
      note: "全市场股票基础资料与上市日期"
    - data_source: tushare
      dataset: stock_daily_bar
      required: true
      max_lag_days: 0
      cadence: trading_daily
      quality_tier: core
      note: "个股行情与成交额"
    - data_source: tushare
      dataset: daily_basic
      required: true
      max_lag_days: 0
      cadence: trading_daily
      quality_tier: core
      note: "收盘价及每日估值"
    - data_source: tushare
      dataset: income
      max_lag_days: 120
      date_column: ann_date
      cadence: quarterly
      quality_tier: core
      note: "利润表 PIT 数据"
    - data_source: tushare
      dataset: fina_indicator
      max_lag_days: 120
      date_column: ann_date
      cadence: quarterly
      quality_tier: confirming
      note: "财务指标备用数据"
    - data_source: tushare
      dataset: balancesheet
      max_lag_days: 120
      date_column: ann_date
      cadence: quarterly
      quality_tier: core
      note: "净资产与商誉"
    - data_source: tushare
      dataset: forecast
      date_column: ann_date
      cadence: event
      quality_tier: confirming
      note: "业绩预告 PIT 数据"
    - data_source: tushare
      dataset: stk_holdertrade
      date_column: ann_date
      cadence: event
      quality_tier: confirming
      note: "股东及董监高增减持事件"
    - data_source: tushare
      dataset: hk_hold
      date_column: trade_date
      cadence: trading_daily
      quality_tier: confirming
      note: "北向个股持仓，仅对北向标的评估"
    - data_source: tushare
      dataset: limit_list_d
      date_column: trade_date
      cadence: event
      quality_tier: confirming
      note: "连续跌停事件"
    - data_source: tushare
      dataset: suspend_d
      date_column: suspend_date
      cadence: event
      quality_tier: confirming
      note: "停牌事件辅助确认"
    - data_source: tushare
      dataset: index_member
      static: true
      cadence: event
      quality_tier: core
      note: "申万行业成分股归属（含进出期，按基准日过滤活跃成员）"
    - data_source: tushare
      dataset: index_classify
      static: true
      cadence: static
      quality_tier: core
      note: "申万行业分类代码与名称（L1/L2）"
    - data_source: tushare
      dataset: index_daily_bar
      max_lag_days: 0
      cadence: trading_daily
      quality_tier: confirming
      note: "沪深300 基准K线（动量相对强弱基准）"
    - data_source: tushare
      dataset: cashflow
      max_lag_days: 120
      date_column: ann_date
      cadence: quarterly
      quality_tier: confirming
      note: "现金流量表（经营现金流/净利润 含金量）"
    - data_source: tushare
      dataset: margin_detail
      enabled: true
      cadence: trading_daily
      quality_tier: confirming
      note: "全市场两融余额，覆盖 4400+ 标的用于 margin_stress 预警"
    - data_source: tushare
      dataset: share_float
      enabled: true
      date_column: ann_date
      cadence: event
      quality_tier: confirming
      note: "限售解禁数据，用于 lockup_release 规则"
    - data_source: tushare
      dataset: pledge_detail
      enabled: true
      date_column: ann_date
      cadence: event
      quality_tier: confirming
      note: "股权质押明细，用于 pledge_overhang 规则"
    - data_source: tushare
      dataset: block_trade
      enabled: true
      date_column: trade_date
      cadence: event
      quality_tier: confirming
      note: "大宗交易数据，用于 block_trade_discount 规则"
    - data_source: lixinger
      dataset: pledge_info
      enabled: false
      cadence: event
      quality_tier: optional
      note: "覆盖不足，规则关闭"
