quant_brief:
  schema_version: 1
  title: "A 股量化投研简报"
  artifact_root: "data/analytics/quant_brief"
  latest_root: "data/analytics/quant_brief"
  market_temperature_root: "data/analytics/market_temperature"
  industry_structure_root: "data/analytics/industry_structure"

  temperature_bands:
    - id: low_opportunity
      upper_bound: 20.0
      label: "极寒冰点区"
      equity_position_band: "70%-90%"
      stance: "估值和风险偏好处于极冷区，权益仓位可向进攻区间靠拢。"
      tactic: "战略逆向定投，优先低估值和有基本面支撑的方向。"
    - id: cool_observation
      upper_bound: 40.0
      label: "偏冷修复观察区"
      equity_position_band: "50%-70%"
      stance: "市场偏冷并处于修复观察阶段，仓位以积极但分批为主。"
      tactic: "左侧逢低布局低估改善方向，等待右侧确认。"
    - id: neutral_rotation
      upper_bound: 60.0
      label: "中性平衡轮动区"
      equity_position_band: "40%-50%"
      stance: "市场处于中性轮动状态，保持平衡仓位。"
      tactic: "精选结构分高、资金确认且不拥挤的方向。"
    - id: warm_recovery
      upper_bound: 80.0
      label: "偏热繁荣/修复区"
      equity_position_band: "30%-50%"
      stance: "市场偏热，仓位保持克制并收紧止盈。"
      tactic: "顺势持有但不追高，严控高拥挤行业暴露。"
    - id: high_risk
      upper_bound: null
      label: "高温拥挤高危区"
      equity_position_band: "0%-30%"
      stance: "市场进入高温拥挤区，权益仓位以防守为主。"
      tactic: "大幅降仓，回避高拥挤和杠杆退潮方向。"

  nature:
    true_bull_min_fund_flow: 60.0
    true_bull_min_positive_60d_count: 25
    true_bull_min_composite_delta: 3.0
    pulse_min_technical: 60.0
    pulse_max_fund_flow: 50.0
    pulse_min_positive_20d_count: 25
    pulse_max_positive_60d_count: 5

  veto:
    crowded_industry_share: 30.0
    crowding_temperature: 80.0
    top5pct_share: 0.50
    high_heat_valuation: 80.0
    high_heat_sentiment: 80.0
    margin_negative_threshold: 0.0
    max_crowded_industries: 8
    max_priority_industries: 5
    max_avoid_industries: 5
    max_lagging_industries: 5
    min_priority_structure_score: 50.0
    require_fund_flow_confirmation: true

  risk_gates:
    valuation_red_flag_temperature: 85.0
    composite_red_flag_temperature: 65.0
    defensive_position_band: "0%-30%"
    # 快慢背离闸门（与 scoring_risk 的 Phase 3 门限保持一致）
    divergence_extreme_threshold: 15.0
    divergence_hot_fast_temperature: 60.0
    divergence_ice_fast_temperature: 35.0
    main_money_outflow_share_hard: -0.05
    market_amount_high_percentile: 90.0
    margin_buy_share_warning: 0.10
    margin_penetration_extreme_percentile: 95.0
    breadth_above_ma60_healthy: 0.50
    breadth_above_ma60_weak: 0.30
    positive_20d_sector_min: 10
    industry_tcr_warning: 20.0
    industry_tcr_hard: 25.0
    industry_crowding_hard_temperature: 90.0

  # 跨周期胜率/赔率矩阵（odds-matrix-v1 校准版：61 天回归后弱化方向性分项，校准说明见设计文档第 9 节）
  # 设计说明见 docs/research/cross_cycle_odds_matrix_design.md 第 4 节
  cross_cycle:
    rules_version: "odds-matrix-v1"
    # 胜率环境 S
    win_sync_bonus: 10.0
    win_ice_extreme_penalty: -15.0
    win_hot_extreme_penalty: -10.0
    short_ice_threshold: 35.0
    short_hot_threshold: 65.0
    win_short_ice_bonus: 10.0
    win_short_hot_penalty: -10.0
    width_healthy_threshold: 0.60
    width_weak_threshold: 0.40
    win_width_healthy_bonus: 10.0
    win_width_weak_penalty: -10.0
    win_fund_confirmed_bonus: 10.0
    win_fund_outflow_penalty: -10.0
    win_external_pending_penalty: -10.0
    win_level_high: 5.0
    win_level_low: -25.0
    # 赔率环境 O
    slow_low_threshold: 50.0
    slow_high_threshold: 65.0
    odds_slow_low_bonus: 20.0
    odds_slow_high_penalty: -10.0
    valuation_low_threshold: 40.0
    valuation_high_threshold: 70.0
    odds_valuation_low_bonus: 10.0
    odds_valuation_high_penalty: -10.0
    diffusion_low_threshold: 30.0
    diffusion_high_threshold: 60.0
    odds_diffusion_low_bonus: 10.0
    odds_diffusion_high_penalty: -10.0
    crowding_share_threshold: 10.0
    odds_crowding_none_bonus: 10.0
    odds_crowding_high_penalty: -10.0
    macro_loose_threshold: 40.0
    macro_tight_threshold: 65.0
    odds_macro_loose_bonus: 10.0
    odds_macro_tight_penalty: -10.0
    external_pressure_threshold: 75.0
    odds_external_pressure_penalty: -10.0
    odds_level_high: 5.0
    odds_level_low: -10.0
    # 轨迹修正
    trajectory_convergence_bonus: 5.0
    trajectory_deterioration_penalty: -5.0
    trajectory_rising_bonus: 5.0
    trajectory_falling_penalty: -5.0
    composite_trend_window: 5
    # 象限仓位微调（ppe）
    adj_core_pp: 0.0
    adj_left_pp: -7.0
    adj_band_pp: -5.0
    adj_avoid_pp: -5.0
