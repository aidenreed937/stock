# 宏观风控策略配置（V3 单宽基 / V4 哑铃轮动 / V5 动量增强 / V6 三核自适应）
# 该文件作为策略回测、跨周期审计与 14:50 生产实盘执行的统一配置信任源。

# 1. 横向对比基准配置
benchmarks:
  - symbol: "000985.CSI"
    name: "中证全指"
  - symbol: "000300.SH"
    name: "沪深300"

# 2. 6 大跨周期历史宏观范式切片
