  #   strategy_class: "IndustryL2DirectionStrategy"
  #   benchmark_symbol: "000985.CSI"
  #   top_k: 3
  #   rebalance_period: 63
  #   score_column: "return_60d"
  #   valuation_max: 90.0
  #   direction_gate: true
  #   direction_high_threshold: 66.0
  #   description: "二级方向池 + 方向防守门：方向高位×非量价齐升剔除（防守语义，实证弱于基线）"
  #   friction:
  #     commission_rate: 0.0001
  #     slippage_rate: 0.0005
  #     rebalance_deadband: 0.03

  industry_l2_direction_guarded:
    strategy_class: "IndustryL2DirectionStrategy"
    benchmark_symbol: "000985.CSI"
    top_k: 3
    rebalance_period: 63
    score_column: "return_60d"
    valuation_max: 90.0
    capex_gate: true
    crowd_gate: true
    crowd_max: 85.0
    panic_scale: 0.5
    panic_thr: 65.0
    description: "二级方向池 + 组合防守门（capex洪峰 + 拥挤度一票否决 + 恐慌降仓50%）：样本外 Sharpe 0.15→0.31（见 industry_capex_combo.md）"
    friction:
      commission_rate: 0.0001
      slippage_rate: 0.0005
      rebalance_deadband: 0.03
