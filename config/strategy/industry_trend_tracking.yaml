# 申万二级行业产业趋势跟踪策略配置
# 面向周期尺度全球产业趋势的确认与跟踪，季度调仓追「动量 + 估值防守」，方向池限定全球共振二级行业。

# 1. 横向对比基准配置
benchmarks:
  - symbol: "000985.CSI"
    name: "中证全指"
  - symbol: "000300.SH"
    name: "沪深300"

# 2. 策略参数配置（全部为申万二级方向池策略，数据源 industry_l2_panel_daily）
strategies:
  industry_l2_direction:
    strategy_class: "IndustryL2DirectionStrategy"
    benchmark_symbol: "000985.CSI"
    top_k: 3
    rebalance_period: 63
    score_column: "return_60d"
    valuation_max: 90.0
    description: "二级方向池基线：动量 Top3 + 估值防守（pe5y<=90），全球共振 13 行业（全周期年化 +12.50%）"
    friction:
      commission_rate: 0.0001
      slippage_rate: 0.0005
      rebalance_deadband: 0.03

  industry_l2_direction_qlq:
    strategy_class: "IndustryL2DirectionStrategy"
    benchmark_symbol: "000985.CSI"
    top_k: 3
    rebalance_period: 63
    score_column: "return_60d"
    valuation_max: 90.0
    require_qlq: true
    description: "二级方向池 + 量价齐升硬门：只买营收/净利 TTM 双正行业（实证小池拖累，参考对比）"
    friction:
      commission_rate: 0.0001
      slippage_rate: 0.0005
      rebalance_deadband: 0.03

  industry_l2_direction_gate:
    strategy_class: "IndustryL2DirectionStrategy"
    benchmark_symbol: "000985.CSI"
    top_k: 3
    rebalance_period: 63
    score_column: "return_60d"
    valuation_max: 90.0
    direction_gate: true
    direction_high_threshold: 66.0
    description: "二级方向池 + 方向防守门：方向高位×非量价齐升剔除（防守语义，实证弱于基线）"
    friction:
      commission_rate: 0.0001
      slippage_rate: 0.0005
      rebalance_deadband: 0.03
