# 申万二级行业产业趋势跟踪策略配置
# 面向周期尺度全球产业趋势的确认与跟踪，季度调仓追「动量 + 估值防守」，方向池限定全球共振二级行业。

# 1. 横向对比基准配置
benchmarks:
  - symbol: "000985.CSI"
    name: "中证全指"
  - symbol: "000300.SH"
    name: "沪深300"

# 2. 策略参数配置（全部为申万二级方向池策略，数据源 industry_l2_panel_daily）
strategies:
  industry_l2_direction:
    strategy_class: "IndustryL2DirectionStrategy"
    benchmark_symbol: "000985.CSI"
    top_k: 3
    rebalance_period: 63
    score_column: "return_60d"
    valuation_max: 90.0
    description: "二级方向池基线：动量 Top3 + 估值防守（pe5y<=90），全球共振 13 行业（全周期年化 +12.50%）"
    friction:
      commission_rate: 0.0001
      slippage_rate: 0.0005
      rebalance_deadband: 0.03

  industry_l2_direction_qlq:
    strategy_class: "IndustryL2DirectionStrategy"
    benchmark_symbol: "000985.CSI"
    top_k: 3
    rebalance_period: 63
    score_column: "return_60d"
    valuation_max: 90.0
    require_qlq: true
    description: "二级方向池 + 量价齐升硬门：只买营收/净利 TTM 双正行业（全周期弱于基线，但样本外 2022 后 Sharpe 0.32 vs 基线 0.15，供需层唯一正例）"
    friction:
      commission_rate: 0.0001
      slippage_rate: 0.0005
      rebalance_deadband: 0.03

  # 【2026-08-31 停用】方向防守门（gate）：全周期 +8.34% / 样本外 0.14 均弱于基线，且方向分
  # 因子实测 IC 仅 +0.99%（无预测力），修复月频腿前视后进一步走弱。SKILL 定位已明确方向分
  # 作「拐点预警信号」不作策略门；如需恢复取消注释即可。
