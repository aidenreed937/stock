# 申万行业产业趋势跟踪策略配置
# 面向周期尺度全球产业趋势的确认与跟踪，季度调仓追「景气方向」而非「景气高低」。

# 1. 横向对比基准配置
benchmarks:
  - symbol: "000985.CSI"
    name: "中证全指"
  - symbol: "000300.SH"
    name: "沪深300"

# 2. 策略参数配置
strategies:
  industry_trend_momentum:
    strategy_class: "IndustryTrendTrackingStrategy"
    benchmark_symbol: "000985.CSI"
    top_k: 3
    rebalance_period: 63
    score_column: "trend_momentum"
    direction_high_threshold: 66.0
    direction_quality_min: 50.0
    description: "产业趋势跟踪基线：季度调仓追环比改善（趋势确认），叠加方向层象限过滤（方向高位×非量价齐升排除），已验证样本外 Sharpe ≈ 0.39"
    friction:
      commission_rate: 0.0001
      slippage_rate: 0.0005
      rebalance_deadband: 0.03

  industry_trend_quality:
    strategy_class: "IndustryTrendTrackingStrategy"
    benchmark_symbol: "000985.CSI"
    top_k: 3
    rebalance_period: 63
    score_column: "trend_momentum"
    supply_demand_min: 60.0
    crowding_max: 85.0
    description: "产业趋势跟踪 + 供需质量门（量价齐升）+ 拥挤度防守：只买真需求驱动、剔除过热"
    friction:
      commission_rate: 0.0001
      slippage_rate: 0.0005
      rebalance_deadband: 0.03
