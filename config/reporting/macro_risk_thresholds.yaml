# 宏观风控双轨制雷达研报评级分段、图标与定性话术配置表
# 研究员可在此直接调整警戒线分位数及研报呈现的文案。

dimensions:
  leverage:
    name: "两融杠杆"
    category: "生存与毁灭级风险 (硬约束 / 强平与失速)"
    missing:
      grade: "数据暂缺"
      icon: "⚪"
      comment: "历史数据不足"
    tiers:
      - min: 85.0
        grade: "极度高危"
        icon: "🔴"
        comment: "存量杠杆触顶，严防连环多杀多强平"
      - min: 65.0
        grade: "偏高警惕"
        icon: "🟡"
        comment: "杠杆资金积聚，容错空间收窄"
      - max: 30.0
        grade: "杠杆健康"
        icon: "🟢"
        comment: "场内杠杆处于低位，无踩踏风险"
      - default: true
        grade: "规模适中"
        icon: "⚪"
        comment: "杠杆水平处于正常区间"

  crowding:
    name: "换手拥挤"
    category: "生存与毁灭级风险 (硬约束 / 强平与失速)"
    missing:
      grade: "数据暂缺"
      icon: "⚪"
      comment: "历史数据不足"
    tiers:
      - min: 85.0
        grade: "严重过热"
        icon: "🔴"
        comment: "换手极度亢奋，短线买力濒临透支"
      - min: 65.0
        grade: "偏热过载"
        icon: "🟡"
        comment: "交易活跃度高，面临动量失速"
      - max: 20.0
        grade: "地量冰点"
        icon: "🟢"
        comment: "交投极度低迷，常对应坚实地量底"
      - default: true
        grade: "换手适中"
        icon: "⚪"
        comment: "交投活跃度处于正常区间"

  flow:
    name: "主力资金"
    category: "生存与毁灭级风险 (硬约束 / 强平与失速)"
    missing:
      grade: "数据暂缺"
      icon: "⚪"
      comment: "历史数据不足"
    special_cases:
      - condition: "etf_score_gte_90"
        etf_score_min: 90.0
        grade: "国家队托底"
        icon: "🟢"
        comment: "宽基ETF获大额净申购托底，对冲现货抛压"
      - condition: "divergence_and_flow"
        div_score_min: 85.0
        val_min: 65.0
        grade: "主力派发"
        icon: "🔴"
        comment: "主力坚决流出且散户激进接盘，筹码严重背离"
    tiers:
      - min: 80.0
        grade: "坚决出逃"
        icon: "🔴"
        comment: "主力资金单向大幅净流出，防范真摔"
      - min: 60.0
        grade: "流出承压"
        icon: "🟡"
        comment: "主力资金持续净流出"
      - max: 30.0
        grade: "流入活跃"
        icon: "🟢"
        comment: "主力资金积极回流加仓"
      - default: true
        grade: "流向平衡"
        icon: "⚪"
        comment: "主力资金流向未见明显倾斜"

  sentiment:
    name: "期权情绪"
    category: "拐点与博弈级信号 (快变量 / 情绪与超跌)"
    missing:
      grade: "数据暂缺"
      icon: "⚪"
      comment: "历史数据不足"
    tiers:
      - min: 80.0
        grade: "极度恐慌"
        icon: "🟢"
        comment: "期权抢买Put避险，反向做多胜率极高"
      - min: 60.0
        grade: "恐慌升温"
        icon: "🟡"
        comment: "避险情绪上升，波动率放大"
      - max: 20.0
        grade: "极度自满"
        icon: "🔴"
        comment: "波动率降至冰点，警惕突发利空杀伤"
      - default: true
        grade: "情绪平稳"
        icon: "⚪"
        comment: "期权定价与避险情绪处于正常区间"

  breadth:
    name: "市场广度"
    category: "拐点与博弈级信号 (快变量 / 情绪与超跌)"
    missing:
      grade: "数据暂缺"
      icon: "⚪"
      comment: "历史数据不足"
    tiers:
      - min: 85.0
        grade: "全面普跌"
        icon: "🟡"
        comment: "个股大面积破位，短期情绪宣泄充分"
      - max: 20.0
        grade: "全线普涨"
        icon: "⚪"
        comment: "赚钱效应扩散，涨多后警惕分化"
      - default: true
        grade: "结构均衡"
        icon: "⚪"
        comment: "涨跌家数与新高新低未现极端背离"

  valuation:
    name: "大盘估值"
    category: "长线估值与安全边际 (慢变量 / 空间)"
    missing:
      grade: "数据暂缺"
      icon: "⚪"
      comment: "历史数据不足"
    tiers:
      - min: 80.0
        grade: "泡沫高估"
        icon: "🔴"
        comment: "风险溢价逼近极端下轨，长期下行风险巨大"
      - min: 65.0
        grade: "偏高微泡沫"
        icon: "🟡"
        comment: "性价比较低，需业绩高增长消化"
      - max: 20.0
        grade: "深度低估"
        icon: "🟢"
        comment: "极具长期战略配置价值"
      - default: true
        grade: "估值合理"
        icon: "⚪"
        comment: "处于历史中位数水平"

  corporate:
    name: "产业资本"
    category: "企业与股东行为 (微观底与出逃)"
    missing:
      grade: "数据暂缺"
      icon: "⚪"
      comment: "历史数据不足"
    tiers:
      - min: 80.0
        grade: "减持潮起"
        icon: "🔴"
        comment: "产业资本与董监高净减持激增，警惕产业离场"
      - max: 25.0
        grade: "回购托底"
        icon: "🟢"
        comment: "上市公司回购与股东净增持高发，产业资本积极抄底"
      - default: true
        grade: "运作常态"
        icon: "⚪"
        comment: "产业资本增减持与回购处于平稳区间"

  cross_asset:
    name: "跨资产与宏观"
    category: "大类资产与跨市场流动性 (转债/铜金/利差)"
    missing:
      grade: "数据暂缺"
      icon: "⚪"
      comment: "历史数据不足"
    tiers:
      - min: 75.0
        grade: "跨市场过热"
        icon: "🔴"
        comment: "转债溢价与铜金比高企，跨市场流动性偏紧或过热"
      - max: 25.0
        grade: "跨市场低估"
        icon: "🟢"
        comment: "转债价格与铜金比处于低位，宏观避险过度迎均值回归"
      - default: true
        grade: "跨资产均衡"
        icon: "⚪"
        comment: "跨市场估值与宏观利差处于中枢水平"

indices:
  overheat:
    threshold_critical: 65.0
    threshold_warning: 60.0
    title_critical: "极度狂热 (极高回撤风险)"
    title_warning: "偏热过载 (进入预警区间)"
  panic:
    threshold_critical: 70.0
    threshold_warning: 60.0
    title_critical: "极度恐慌 (超跌反弹机会)"
    title_warning: "恐慌升温 (关注左侧建仓)"
