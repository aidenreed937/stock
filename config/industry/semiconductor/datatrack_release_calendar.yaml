# ============================================================================
# TrendForce DataTrack 内存现货月度基准见报日日历 (proxy_calendar)
#
# 用途：为 semiconductor_memory_benchmark 补齐 Point-In-Time (PIT) 可观测见报日。
#       在 Curated 层显式标注 release_date_status='proxy_calendar'。
#
# 来源说明：TrendForce DataTrack API (Finwhale) 仅返回观测期时间戳 (period)，
#           无独立的公开发布时间字段。本文件根据 TrendForce 月度现货结算惯例
#           （次月第 3 个工作日完成全月均价归档发布），为 44 个历史统计月生成
#           受版本管理的保守见报生效日历。
#
# 硬性约束：
#       * RAW 层保持源端原貌（release_date 为空，status='unavailable'）；
#       * Curated 黄金表通过本配置补齐 release_date，并显式标注 'proxy_calendar'，
#         下游回测与特征工厂严禁将此代理冒充为交易所法定申报日。
# ============================================================================
schema_version: 1

provenance:
  policy: next_month_business_day_proxy
  status: rule_derived_proxy
  source: TrendForce_DataTrack_Settlement_Protocol
  rule_description: "TrendForce 现货月度均价在全月交易结束后结算，统一采用次月第 3 个平日工作日作为保守见报日"

