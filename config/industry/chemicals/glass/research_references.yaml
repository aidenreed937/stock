# 5. 研报质量真伪甄别规则 (买方排雷指引)
quality_verification_rules:
  - rule: "敢于预测亏损"
    pass_criteria: "敢于将 2026 年利润预测下修至 -3 亿至 -5 亿元，如实反映资产减值与现金流失血；过滤在深亏期仍强行预测盈利数亿的顺周期报告。"
  - rule: "严格区分报价规格"
    pass_criteria: "严格区分 2.0mm 原片裸板 (8.5~10.25元) 与镀膜钢化成品片 (12.48元)，算清后道加工费与成品率差异。"
  - rule: "识别真假出清"
    pass_criteria: "坚决不把'堵窑口减产30%'误认为出清，明确强调必须等到冬季采暖季逼迫二三线彻底放水冷修。"
  - rule: "清醒评估估值天花板"
    pass_criteria: "深谙双寡头威慑限价博弈，稳态利润锚定 30~33 亿元、目标价锚定 20~25 元，坚决不给 40 倍 PE 暴利幻想。"
