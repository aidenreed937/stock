# 2. 核心跟踪时间窗口与决战时钟
tracking_time_windows:
  winter_clearing_window:
    period: "每年 11 月至次年 2 月 (供暖季 + 岁末年初)"
    gate_target: "left_side_odds (左侧极值赔率潜伏)"
    driver_mechanics: "北方供暖天然气涨价脉冲 + 北方建筑停工 + 岁末资金抽水，二三线高龄窑炉无钱大修，被迫实质放水冷修。"
    key_metrics:
      - "全国在产日熔量跌破 13.5 万吨/日"
      - "有效产能利用率降至 75% 以下"
      - "1月31日前上市公司年度业绩预告披露巨亏/大额减值，股价不创新低 (利空出尽)"

  spring_validation_window:
    period: "每年 3 月至 4 月 (春节后复工金三银四)"
    gate_target: "right_side_confirmation (右侧胜率确认加码)"
    driver_mechanics: "春节长假累库至 8000 万箱峰值后，检验复工刚需承接力与真实去库斜率。"
    key_metrics:
      - "周度出货率连续 3 周超过 100% (105% ~ 115%)"
      - "样本企业厂库连续大幅下降"
      - "郑商所 FG 期货贴水修复，基差率转正"
      - "核心标的放量突破站稳 MA20"

  report_verification_window:
    period: "每年 4 月下旬 (一季报与正式年报落地)"
    gate_target: "业绩与财务质量后验"
    driver_mechanics: "轻装上阵、原料低价全额结转、折旧基数下降，验证由亏转盈成色。"
    key_metrics:
      - "毛利率回升确认由玻璃售价上涨驱动 (排除纯碱单向暴跌的被动假改善)"
      - "经营活动现金流量净额 (OCF) 大幅激增转正"
      - "资本开支 (Capex) 维持冰冻低位"

