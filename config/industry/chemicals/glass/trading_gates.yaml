# 玻璃周期股分阶段量化交易门禁配置 (Glass Cyclical Trading Gates)
# 模块高内聚配置：面向重资产连续生产、窑炉冷修出清与高 Beta 周期性

schema_version: 2
product_name: "平板玻璃与光伏玻璃"
symbols: ["FG", "PVG"]
category: "heavy_asset_continuous_kiln"
profile_name: "glass_cyclical_gate"
title: "玻璃周期股分阶段量化交易门禁与标的映射"
description: "基于边际出清线、在产日熔量、四阶段库存天数与估值反向时钟的三门禁决策体系"

left_side_odds:
  name: "玻璃左侧赔率建仓门禁"
  target_position_pct_max: 30.0  # 底仓上限 20%~30%，严禁满仓
  rules:
    margin_regime_any:
      - "deep_loss"
      - "near_breakeven"
    pb_percentile_10y_max: 0.15  # 个股或行业 PB 处于历史 15% 以下极值分位
    pb_absolute_max: 1.10        # 接近或低于 1.0 破净线
    preferred_target_role: "alpha_leader" # 优先布局成本曲线最左侧龙头 (旗滨集团 601636.SH / 福莱特 601865.SH)

right_side_confirmation:
  name: "玻璃右侧胜率确认门禁"
  target_position_pct_max: 80.0  # 加码至 80% 重仓进攻
  rules:
    daily_melting_capacity_decrease_min: 500.0 # 全国在产日熔量净减少 >= 500 T/D (冷修超新点火)
    destocking_weeks_min: 3      # 厂家库存天数连续 3 周去化
    futures_basis_rate_min: 0.0  # 郑商所 FG 期货贴水修复，基差率转正 (现货升水)
    technical_ma_break: "MA20"   # 收盘价放量突破 20 日均线
    valuation_ceiling_pb_10y_max: 0.40 # 估值天花板: PB 10Y 分位必须 <= 40%
    demand_validation:
      scissors_spread_yoy_min: 0.0 # 供需剪刀差改善收窄
      export_volume_yoy_min: 10.0  # 或海关 7005 浮法出口同比 > 10%
    preferred_target_role: "beta_elastic"

top_escape:
  name: "玻璃逃顶多因子清仓门禁"
  action: "clear_position"
  rules:
    trigger_match_count_min: 3
    warning_match_count_min: 2
    operating_rate_min: 0.90     # 窑炉开工负荷全面打满 (>90%)
    spread_margin_regime: "high_profit" # 理论单吨毛利或单平毛利处于超额暴利
    pe_ttm_low_trap_max: 10.0    # 静态 PE(TTM) 降至 8~10 倍个位数 (低 PE 见顶陷阱)
    pb_percentile_10y_min: 0.65  # 估值处于历史 65% 分位以上
    squeeze_trap_divergence:
      scissors_spread_yoy_max: 0.0 # 内需增速开始跌破供给增速

target_universe_mapping:
  alpha_leader:
    - symbol: "601636.SH"
      name: "旗滨集团"
      role_desc: "浮法玻璃成本绝对龙头，享有综合超白原片与硅砂低成本阿尔法"
    - symbol: "601865.SH"
      name: "福莱特"
      role_desc: "光伏玻璃全球双寡头，1200T/D 超大窑炉与低铁砂自给率高，成长型周期左侧底仓"
  beta_elastic:
    - symbol: "000012.SZ"
      name: "南玻A"
      role_desc: "老牌玻璃综合体，右侧反弹弹性好"
    - symbol: "600586.SH"
      name: "金晶科技"
      role_desc: "超白浮法与纯碱一体化高弹性品种"
