regime_thresholds:
  high_profit: 300.0         # 理论毛利 > 300 元/吨：超额暴利
  profitable: 0.0            # 0 ~ 300 元/吨：正常盈利
  near_breakeven: -150.0     # -150 ~ 0 元/吨：盈亏平衡 / 微亏
  # < -150 元/吨：深度亏损 (跌穿现金保本，倒逼装置检修)
