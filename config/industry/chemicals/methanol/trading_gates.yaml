# 甲醇周期股分阶段量化交易门禁配置 (Methanol Cyclical Trading Gates)
# 模块高内聚配置：面向 A 类大宗标准化与期货品种 (完全竞争同质化大宗、西北坑口与沿海 MTO 供需剪刀差、港口显性库存与交割仓单支配)

schema_version: 2
product_name: "甲醇"
symbol: "MA"
category: "A_commodity_standard"
profile_name: "commodity_standard_gate"
title: "甲醇周期股分阶段量化交易门禁与标的映射"
description: "基于边际成本线、MTO 供需剪刀差、太仓主港库存与估值反向时钟的三门禁决策体系"

# =============================================================
# 门禁规则定义
# =============================================================
left_side_odds:
  name: "甲醇左侧赔率建仓门禁"
  target_position_pct_max: 30.0
  rules:
    margin_regime_any:
      - "deep_loss"
      - "near_breakeven"
    cash_cost_drain_check: true        # 现货跌破边际煤制现金成本线 (1850 元/吨)，西北与华北装置现金失血
    pb_percentile_10y_max: 0.15        # 个股或行业 PB 处于历史 15% 以下极值低位
    pb_absolute_max: 0.85              # 或绝对 PB 深度破净 (< 0.85)
    preferred_target_role: "alpha_leader" # 优先布局现代煤化工成本最左侧龙头 (如宝丰能源、华鲁恒升)

right_side_confirmation:
  name: "甲醇右侧胜率确认门禁"
  target_position_pct_max: 80.0
  rules:
    port_inventory_destocking_weeks_min: 3 # 沿海主港 (太仓/江阴/宁波) 库存连续去化 >= 3 周
    operating_rate_max: 0.75           # 行业综合开工率受成本倒逼跌破 75%
    basis_rate_min: 0.0                # 期货主力基差平水或转正 (现货升水修复)
    technical_ma_break: "MA20"         # 放量突破 20 日均线
    valuation_ceiling_pb_10y_max: 0.40 # 估值天花板: PB 分位数 <= 40% (杜绝高位追多)
    demand_validation:
      downstream_mto_op_min: 0.82      # 核心下游 MTO (煤/甲醇制烯烃) 装置开工负荷回升至 82% 以上
      traditional_demand_yoy_min: 3.0  # 传统下游 (醋酸/甲醛/二甲醚) 综合消费同比回暖 (> +3%)
    preferred_target_role: "beta_elastic" # 右侧切换至高贝塔弹性标的 (如兖矿能源、金牛化工)

top_escape:
  name: "甲醇逃顶一票否决门禁"
  action: "clear_position"
  rules:
    operating_rate_min: 0.88           # 行业整体开工率超 88% 且维持高位钝化
    spread_margin_regime: "high_profit" # 煤制甲醇理论毛利突破历史 90% 极值暴利区间
    port_inventory_accumulation_max_w_tons: 110.0 # 沿海主港库存突破 110 万吨被动累库红线
    mto_margin_loss_trap: true         # 沿海采购外购甲醇的 MTO 装置陷入深度亏损面临停工
    pe_ttm_low_trap_max: 8.0           # 静态 PE(TTM) 降至 8 倍个位数 (周期低 PE 陷阱)
    squeeze_trap_divergence:
      pb_percentile_10y_min: 0.60      # 估值处于历史 60% 分位高位
      scissors_spread_yoy_max: 0.0     # MTO 需求剪刀差见顶转负

# =============================================================
# 标的角色与工艺路线映射 (甲醇行业)
# =============================================================
target_universe_mapping:
  alpha_leader:
    - symbol: "600989.SH"
      name: "宝丰能源"
      role_desc: "全球最大单体煤制甲醇/烯烃一体化龙头，坑口原煤自给率高，全流程完全成本 1600~1900 元/吨，长期抗亏阿尔法极致"
    - symbol: "600426.SH"
      name: "华鲁恒升"
      role_desc: "水煤浆气化成本领跑者，德州与荆州双基地协同，多联产柔性切换，在周期底部抗风险极强"

  beta_elastic:
    - symbol: "600188.SH"
      name: "兖矿能源"
      role_desc: "煤炭与高端煤化工综合巨头，甲醇装置规模达 240 万吨，煤价与化工品价差共振时贝塔弹性大"
    - symbol: "600722.SH"
      name: "金牛化工"
      role_desc: "纯正甲醇小市值标的，主营暴露度超 80%，对甲醇现货价格上涨敏感度极高"
