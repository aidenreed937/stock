# 乙二醇周期股分阶段量化交易门禁配置 (MEG Cyclical Trading Gates)
# 模块高内聚配置：面向 A 类大宗标准化与期货品种 (完全竞争同质化大宗、煤/油双工艺边际成本出清、华东主港库存强支配)

schema_version: 2
product_name: "乙二醇"
symbol: "MEG"
category: "A_commodity_standard"
profile_name: "commodity_standard_gate"
title: "乙二醇周期股分阶段量化交易门禁与标的映射"
description: "基于边际成本线、供需剪刀差、港口显性库存与估值反向时钟的三门禁决策体系"

# =============================================================
# 门禁规则定义
# =============================================================
left_side_odds:
  name: "乙二醇左侧赔率建仓门禁"
  target_position_pct_max: 30.0
  rules:
    margin_regime_any:
      - "deep_loss"
      - "near_breakeven"
    cash_cost_drain_check: true        # 现货跌穿边际煤制现金成本线 (4700 元/吨)，行业面临失血减产
    pb_percentile_10y_max: 0.15        # 个股或行业 PB 处于历史 15% 以下极值低位
    pb_absolute_max: 0.90              # 或绝对 PB 深度破净 (< 0.90)
    preferred_target_role: "alpha_leader" # 优先布局大炼化一体化成本最左侧龙头 (如恒力石化、荣盛石化)

right_side_confirmation:
  name: "乙二醇右侧胜率确认门禁"
  target_position_pct_max: 80.0
  rules:
    port_inventory_destocking_weeks_min: 3 # 华东主港库存连续去化 >= 3 周 (港口显性去库确认)
    operating_rate_max: 0.75           # 行业综合负荷跌破 75% 警戒线 (低效煤制装置实质性检修出清)
    basis_rate_min: 0.0                # 期现基差平水或转升水 (现货抗跌强于盘面)
    technical_ma_break: "MA20"         # 放量突破 20 日均线
    valuation_ceiling_pb_10y_max: 0.45 # 估值天花板: PB 分位数 <= 45% (防高位追涨)
    demand_validation:
      downstream_polyester_op_min: 0.82 # 下游聚酯长丝/瓶片负荷回升至 82% 以上
      apparent_consumption_yoy_min: 5.0 # 国内表观消费量同比增速转正 (> +5%)
    preferred_target_role: "beta_elastic" # 右侧切换至破净高贝塔弹性标的 (如华鲁恒升、东方盛虹)

top_escape:
  name: "乙二醇逃顶一票否决门禁"
  action: "clear_position"
  rules:
    operating_rate_min: 0.88           # 行业整体开工率超 88%，煤制与油制全面开工打满
    spread_margin_regime: "super_profit" # 理论完全成本覆盖率 100%，边际现金利差突破历史 90% 极值
    port_inventory_accumulation_max_w_tons: 120.0 # 华东主港库存突破 120 万吨被动累库红线
    pe_ttm_low_trap_max: 8.5           # 周期龙头静态 PE(TTM) 跌至 8.5 倍个位数 (周期顶部低 PE 陷阱)
    squeeze_trap_divergence:
      pb_percentile_10y_min: 0.65      # 估值透支至历史 65% 分位高位
      scissors_spread_yoy_max: 0.0     # 下游长丝累库导致供需剪刀差转负

# =============================================================
# 标的角色与工艺路线映射 (乙二醇行业)
# =============================================================
target_universe_mapping:
  alpha_leader:
    - symbol: "600346.SH"
      name: "恒力石化"
      role_desc: "大炼化油制 MEG 成本领跑者，完全成本 4600~4900 元/吨，自用与外售结合，抗周期波动能力极强"
    - symbol: "002493.SZ"
      name: "荣盛石化"
      role_desc: "浙石化 200+ 万吨 MEG 规模效应，原料轻质化裂解协同，左侧极值估值安全垫厚"

  beta_elastic:
    - symbol: "600426.SH"
      name: "华鲁恒升"
      role_desc: "煤制乙二醇能耗与成本标杆，多联产柔性切换，在价差景气反转时利润弹性与 EPS 增厚极为显著"
    - symbol: "000301.SZ"
      name: "东方盛虹"
      role_desc: "炼化与下游差别化涤纶长丝一体化，高负债高贝塔，右侧反转向上价格弹性大"
