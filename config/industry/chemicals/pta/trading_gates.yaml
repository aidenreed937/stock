# PTA / 聚酯产业链周期股分阶段量化交易门禁配置 (PTA Cyclical Trading Gates)
# 模块高内聚配置：面向 A 类大宗标准化与期货品种 (郑商所 TA 主力、聚酯长丝与织机开工驱动)

schema_version: 2
product_name: "精对苯二甲酸"
symbol: "TA"
category: "A_commodity_standard"
profile_name: "commodity_standard_gate"
title: "PTA与大炼化周期股分阶段量化交易门禁与标的映射"
description: "基于倒轧加工费亏损线、聚酯库存时钟与大炼化估值反向时钟的三门禁决策体系"

# =============================================================
# 门禁规则定义 (支持扁平化直接读取与 profiles 兼容)
# =============================================================
left_side_odds:
  name: "PTA 左侧赔率建仓门禁"
  target_position_pct_max: 30.0  # 底仓配置上限 30%
  rules:
    margin_regime_any:           # 加工费跌入深度亏损 (<350元/吨) 或微亏区间
      - "deep_loss"
      - "near_breakeven"
    pb_percentile_10y_max: 0.15  # 个股 PB 处于历史 15% 以下分位
    pb_absolute_max: 0.85        # 或破净 (<0.85)
    preferred_target_role: "alpha_leader" # 首选炼化一体化龙头 (恒力石化、荣盛石化)

right_side_confirmation:
  name: "PTA 右侧胜率确认门禁"
  target_position_pct_max: 80.0  # 加码进攻
  rules:
    operating_rate_max: 0.75     # 行业开工负荷受集中检修压制至 75% 以下
    destocking_weeks_min: 3      # 生产企业库存或仓单连续去化 3 周以上
    basis_rate_min: 0.0          # 期货贴水修复，现货基差走强转升水
    technical_ma_break: "MA20"   # 放量站上 MA20
    demand_validation:           # 真实外需与纺织服装出口验证
      export_volume_yoy_min: 15.0
    preferred_target_role: "beta_elastic" # 右侧切换至下游聚酯长丝高弹性品种 (桐昆股份、新凤鸣)

top_escape:
  name: "PTA 逃顶一票否决门禁"
  action: "clear_position"
  rules:
    operating_rate_min: 0.88     # 全行业开工率饱和钝化 (>88%)
    spread_margin_regime: "high_profit" # 行业加工费进入超额暴利区间 (>600元/吨)
    inventory_flow_regime: "passive_accumulation" # 下游聚酯工厂拿货停滞、被动累库
    pe_ttm_low_trap_max: 8.0     # 周期大炼化个位数低 PE 陷阱

# =============================================================
# 标的角色与产业链一体化映射 (PTA / 大炼化)
# =============================================================
target_universe_mapping:
  alpha_leader:
    - symbol: "600346.SH"
      name: "恒力石化"
      role_desc: "大炼化一体化极致成本龙头，加工费仅 350~380 元/吨，享有全产业链抗亏阿尔法"
    - symbol: "002493.SZ"
      name: "荣盛石化"
      role_desc: "浙石化母公司与全球单体最大 PTA 基地，具备上游原料自给与抗周期规模优势"
  beta_elastic:
    - symbol: "601233.SH"
      name: "桐昆股份"
      role_desc: "涤纶长丝绝对龙头，嘉通能源 500 万吨 PTA 完全自给，长丝景气反弹弹性最高"
    - symbol: "603225.SH"
      name: "新凤鸣"
      role_desc: "长丝双雄之一，独山能源 PTA 支撑全产业链，PB 历史低分位高弹性贝塔标的"
  marginal_indicator:
    - symbol: "000703.SZ"
      name: "恒逸石化"
      role_desc: "大宗 PTA 与长丝贸易敞口较大，受单吨加工差失血与海外炼化波动敏感"
