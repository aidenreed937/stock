# 金融与公用事业板块核心二级行业产业链细分图谱 (L2 Financials)

industries:
  国有大型银行:
    code: "801781.SI"
    level: "L2"
    parent_code: "801780.SI"
    parent_name: "银行"
    category: "稳定红利/金融"
    upstream:
      - "全国广泛网点吸收的低成本居民活期与定期存款"
      - "人民银行公开市场操作与存款准备金"
    downstream:
      - "国家重大战略项目与央国企对公银团贷款"
      - "地方政府专项债与特别国债承销配置"
      - "城乡居民个人住房按揭贷款"
    cost_sensitivity: "负债端成本下行滞后于资产端 LPR 重定价，净息差 (NIM) 承压；风险抵御能力与拨备覆盖率极高"
    demand_drivers: "大行分红率稳定性 (常年 30% 现金分红)、央企市值管理与险资等长线资金配置需求"
    high_frequency_indicators:
      - name: "六大国有行季度净息差 (NIM)、不良率与拨备覆盖率"
        source: "各大国有行财报"
      - name: "中债 10 年期与 30 年期国债收益率走势"
        source: "中债估值中心"

  证券:
    code: "801791.SI"
    level: "L2"
    parent_code: "801790.SI"
    parent_name: "非银金融"
    category: "大金融/Beta"
    upstream:
      - "A 股二级市场成交金额与两融交投活跃度"
      - "同业拆借利率与转融通资金成本"
    downstream:
      - "散户与机构投资者的股票/基金经纪交易"
      - "企业 IPO、再融资与债券发行承销保荐"
      - "券商自营投资 (固收/权益/衍生品做市)"
    cost_sensitivity: "经纪佣金率长期承压 (万分之二以下)；自营投资收益波动直接放大券商季度业绩弹性 (牛市高弹性)"
    demand_drivers: "A 股全市场日均成交额、公募基金降佣降费政策落地、头部券商并购重组预期"
    high_frequency_indicators:
      - name: "沪深京全市场日成交额与全市场融资融券余额"
        source: "沪深交易所"
      - name: "中国结算月度新增投资者开户数"
        source: "中国证券登记结算有限责任公司"

  电力:
    code: "801161.SI"
    level: "L2"
    parent_code: "801160.SI"
    parent_name: "公用事业"
    category: "稳定红利/类债"
    upstream:
      - "长江与主要大江大河来水丰枯 (水电)"
      - "长协电煤供应与入炉标煤单价 (火电)"
      - "光伏组件与风机设备投资造价 (绿电)"
    downstream:
      - "高耗能工业与工商业用户电力直接交易"
      - "城乡居民生活刚性用电"
    cost_sensitivity: "煤电容量电价机制托底火电固定成本；煤价下行驱动火电利润大幅修复；水电充当纯现金流分红机器"
    demand_drivers: "迎峰度夏/度冬极端气候用电负荷、全社会工商业用电量同比增速、电力现货市场改革"
    high_frequency_indicators:
      - name: "全国各省月度全社会用电量及工业用电量增速"
        source: "国家能源局"
      - name: "三峡水库入库/出库实时流量与坝前水位"
        source: "长江水文网"
      - name: "秦皇岛港 Q5500 动力煤长协履约价与市场现货价"
        source: "中国煤炭资源网"
