# 大消费与医药大健康板块核心二级行业产业链细分图谱 (L2 Consumer)

industries:
  白酒:
    code: "801125.SI"
    level: "L2"
    parent_code: "801120.SI"
    parent_name: "食品饮料"
    category: "消费"
    upstream:
      - "酿酒专用有机红缨子高粱/软质小麦"
      - "特种陶瓷酒瓶与高档防伪包装盒"
    downstream:
      - "全国大区分销商/核心终端烟酒店/品牌专卖店"
      - "政商务高端宴请、婚宴与高净值个人礼赠自饮"
    cost_sensitivity: "直接原料占比不足 10%，毛利率受产品结构升级 (千元价格带与次高端放量) 主导"
    demand_drivers: "宏观商务活跃度、高端消费场景修复、经销商蓄水池信心"
    high_frequency_indicators:
      - name: "飞天茅台/普五/国窖1573 原箱及散瓶今日批价"
        source: "今日酒价 / 酒价参考"
      - name: "头部白酒经销商库存周转月数与价格倒挂幅度"
        source: "渠道调研"

  中药:
    code: "801155.SI"
    level: "L2"
    parent_code: "801150.SI"
    parent_name: "医药生物"
    category: "大健康"
    upstream:
      - "天然道地中药材 (天然牛黄/天然麝香/三七/当归/人参/黄连)"
      - "中药饮片 GAP 种植基地"
    downstream:
      - "院内中医院与西医综合医院中医科 (中药配方颗粒/中药注射剂)"
      - "线下 OTC 连锁药房与非处方药品牌专柜 (片仔癀/同仁堂/云南白药)"
    cost_sensitivity: "名贵中药原材料 (牛黄/麝香) 暴涨直接侵蚀 OTC 利润；集采降价主要针对院内独家及非独家中成药"
    demand_drivers: "居民自我保健与滋补养生需求、中药经典名方审批提速、基药目录调整扩容预期"
    high_frequency_indicators:
      - name: "中国中药材综合 200 价格指数与天然牛黄克价"
        source: "中药材天地网"
      - name: "全国中成药集中带量采购中标价格降幅"
        source: "全国中成药联合采购办公室"

  医疗器械:
    code: "801153.SI"
    level: "L2"
    parent_code: "801150.SI"
    parent_name: "医药生物"
    category: "大健康"
    upstream:
      - "特种医用高分子材料、医用钛合金、传感器探头"
      - "光学成像镜头与高性能高压发生器"
    downstream:
      - "公立三甲医院手术室与影像检验中心 (CT/MR/内窥镜/化学发光)"
      - "家用便携医疗与慢病监测 (血糖仪/制氧机/血压计)"
      - "海外医疗设备与高值耗材出口 (欧美及一带一路)"
    cost_sensitivity: "高值耗材 (冠脉支架/骨科关节/人工晶体) 历经国家集采挤出渠道水分；高端影像设备以自主研发核心元器件降本"
    demand_drivers: "医院医疗设备更新改造财政贴息贷款、老龄化带来的手术台数增长、出海替代"
    high_frequency_indicators:
      - name: "各省及国家组织高值医用耗材集采中标结果与报量"
        source: "国家组织高值医用耗材联合采购平台"
      - name: "医疗设备以旧换新各省市招投标采购中标金额"
        source: "中国政府采购网"
