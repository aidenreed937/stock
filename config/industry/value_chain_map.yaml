# 申万 31 行业全集产业链上下游传导链路与高频监测图谱 (Value Chain Map)
# 涵盖申万 31 个一级行业全集 + 重点二级行业 (白酒、半导体)

industries:
  # -------------------------------------------------------------
  # 1. 消费与健康大类 (Consumption & Healthcare)
  # -------------------------------------------------------------
  食品饮料:
    code: "801120.SI"
    category: "消费"
    upstream:
      - "高粱/小麦/大麦等农产品"
      - "包材 (玻璃瓶/纸箱/铝罐)"
      - "白砂糖/食品添加剂"
    downstream:
      - "商超/便利店/电商平台"
      - "餐饮与夜场消费"
      - "商务宴请与送礼场景"
    cost_sensitivity: "农产品与包材成本波动 -> 中游食品饮料毛利率受影响 (高端白酒抗通胀议价能力最强)"
    demand_drivers: "居民可支配收入、餐饮消费景气度、商务活动活跃度"
    high_frequency_indicators:
      - name: "飞天茅台批价走势 (散瓶/原箱)"
        source: "今日酒价 / 行业跟踪"
      - name: "餐饮社零同比增速"
        source: "国家统计局"
      - name: "白酒中秋/春节旺季动销与渠道库存天数"
        source: "券商渠道调研 / 行业协会"

  白酒:
    code: "801125.SI"
    category: "消费"
    upstream:
      - "酿酒专用高粱/小麦"
      - "高端玻璃与陶瓷包材"
    downstream:
      - "经销商/专卖店渠道"
      - "政商务宴请与高净值人群自饮"
    cost_sensitivity: "直接原料占比低，毛利率受产品结构升级主导 (高端吨价上行驱动利润)"
    demand_drivers: "商务活动频率、房地产与基建投资活动、高端社交消费"
    high_frequency_indicators:
      - name: "飞天茅台/普五/国窖1573 核心单品批价"
        source: "今日酒价"
      - name: "经销商库存周转月数与倒挂比例"
        source: "渠道跟踪"

  家用电器:
    code: "801110.SI"
    category: "消费/出海"
    upstream:
      - "铜、铝、特种钢材 (压缩机/电机/钣金)"
      - "面板 (液晶/OLED) 与芯片"
      - "塑料粒子 (ABS/POM/PP) 与制冷剂"
    downstream:
      - "新房装修与存量换新 (以旧换新补贴)"
      - "电商平台 (京东/天猫/抖音) 与线下 KA 渠道"
      - "海外出口 (欧美/东南亚/新兴市场)"
    cost_sensitivity: "上游铜铝、面板与压缩机成本波动 -> 中游整机毛利率受影响；龙头通过产品结构升级、海外产能与提价对冲"
    demand_drivers: "地产竣工与以旧换新/能效补贴政策、出口补库、渗透率提升 (洗碗机/扫地机/中央空调/热泵)"
    high_frequency_indicators:
      - name: "空调/冰箱/洗衣机月度内销出货量与排产"
        source: "产业在线 / 奥维云网"
      - name: "以旧换新与能效补贴政策落地情况"
        source: "商务部 / 各地政府"
      - name: "铜价与面板价格走势"
        source: "上海有色网 (SMM) / 群智咨询"

  医药生物:
    code: "801150.SI"
    category: "大健康"
    upstream:
      - "中药材原料"
      - "医药中间体/原料药 (API)"
      - "生物耗材与科研试剂"
    downstream:
      - "公立医院与基层医疗机构"
      - "连锁零售药房"
      - "海外跨国药企 (CXO/License-out)"
    cost_sensitivity: "医保集采降价压力 -> 倒逼向创新药/器械转型，中药材价格波动影响传统中药毛利"
    demand_drivers: "人口老龄化、医保基金支出总额、创新药海外授权 (BD) 交易活跃度"
    high_frequency_indicators:
      - name: "NMPA 创新药审批与进入医保目录进展"
        source: "国家医保局 / 国家药监局"
      - name: "中国创新药海外 License-out 首付款与总交易金额"
        source: "医药魔方 / 动脉网"
      - name: "中国中药材价格指数"
        source: "中药材天地网"

  美容护理:
    code: "801220.SI"
    category: "消费/医美"
    upstream:
      - "玻尿酸原料 (透明质酸钠)、重组胶原蛋白原料"
      - "表面活性剂、防腐剂、香精香料与化妆品包材"
    downstream:
      - "医疗美容机构 (民营医美连锁/轻医美诊所)"
      - "线上电商 (天猫/抖音/快手) 与线下日化专营店"
    cost_sensitivity: "上游原料毛利率极高 (80%~90%)，主要受下游高企的线上流量推广费用 (销售费用率 40%~50%) 挤压"
    demand_drivers: "颜值经济渗透率提升、重组胶原蛋白技术迭代、合规轻医美注射频次增加"
    high_frequency_indicators:
      - name: "国家药监局重组胶原蛋白/玻尿酸三类医疗器械获批批文"
        source: "国家药品监督管理局 (NMPA)"
      - name: "主流电商大促美妆护肤品类 GMV 及国货品牌市占率"
        source: "青眼情报 / 飞瓜数据"

  商贸零售:
    code: "801200.SI"
    category: "消费/渠道"
    upstream:
      - "日用百货/服装/快消品制造厂商"
      - "黄金珠宝上游精炼厂与批发商"
    downstream:
      - "大众消费者零售与即时配送到家"
      - "婚庆及保值黄金饰品消费"
    cost_sensitivity: "线下租金与人工刚性成本；线上流量买量成本；黄金饰品毛利受国际金价急速波动影响"
    demand_drivers: "居民消费倾向、即时零售渗透率、黄金克金保值消费需求"
    high_frequency_indicators:
      - name: "全国社会消费品零售总额 (社零) 月度增速"
        source: "国家统计局"
      - name: "全国实物商品网上零售额占社零比重"
        source: "商务部"
      - name: "主流黄金品牌足金饰品挂牌克金价格"
        source: "各大品牌珠宝官网"

  社会服务:
    code: "801210.SI"
    category: "消费/出行"
    upstream:
      - "民航/高铁客运、景区自然资源与演艺特许经营权"
      - "酒店物业租赁与装修改造"
    downstream:
      - "大众休闲度假旅游、商务出差与大型会展"
      - "海南离岛免税购物"
    cost_sensitivity: "固定资产折旧与租金成本占比高，客房出租率与客单价直接决定经营杠杆利润释放"
    demand_drivers: "节假日出行意愿、居民文旅消费预算、入境免签政策拉动"
    high_frequency_indicators:
      - name: "国内节假日旅游出游人次与国内旅游收入"
        source: "文化和旅游部"
      - name: "海南离岛免税月度销售金额与免税购物人次"
        source: "海口海关"
      - name: "主要连锁酒店季度每间可售房收入 (RevPAR)"
        source: "企业财报 / STR"

  农林牧渔:
    code: "801010.SI"
    category: "周期/农业"
    upstream:
      - "玉米、豆粕等大宗饲料原料"
      - "种猪/种禽与兽用生物制品疫苗"
    downstream:
      - "生猪/肉禽屠宰与生鲜肉深加工"
      - "农贸市场、商超零售与餐饮连锁"
    cost_sensitivity: "生猪养殖完全成本受饲料 (玉米豆粕) 占比约 55%~60% 主导；猪价波动直接决定全行业巨幅盈亏"
    demand_drivers: "生猪出栏量与能繁母猪存栏量 (供给周期)、猪肉消费季节性 (秋冬腌腊/元旦春节)"
    high_frequency_indicators:
      - name: "全国能繁母猪存栏量月度变动"
        source: "农业农村部"
      - name: "全国外三元生猪出栏均价 (元/公斤)"
        source: "涌益咨询 / 农业农村部"
      - name: "猪粮比价与生猪养殖头均盈利测算"
        source: "国家发改委"

  纺织服饰:
    code: "801130.SI"
    category: "消费/出海"
    upstream:
      - "原棉、粘胶短纤、涤纶长丝等纺织原料"
      - "印染加工与辅料 (拉链/纽扣)"
    downstream:
      - "海外快时尚品牌代工 (申洲/华利)"
      - "国内运动服饰与时尚品牌专卖店"
    cost_sensitivity: "棉价与化纤原料波动直接影响毛利率；海外关税政策与海外产能布局 (越南/印尼/柬埔寨)"
    demand_drivers: "海外品牌客户去库存与补库周期、国内户外运动运动潮流"
    high_frequency_indicators:
      - name: "中国棉花价格指数 (CCIndex 3128B)"
        source: "中国棉花信息网"
      - name: "中国纺织品与服装月度出口金额 (美元口径)"
        source: "海关总署"

  轻工制造:
    code: "801140.SI"
    category: "制造/消费"
    upstream:
      - "进口针叶浆/阔叶浆、国内废黄板纸"
      - "人造板材 (刨花板/中纤板)、五金配件"
    downstream:
      - "新房与存量房定制家居 (欧派/索菲亚/顾家)"
      - "消费电子与烟酒快消品包装印刷"
    cost_sensitivity: "木浆与废纸外盘价格波动决定造纸利润；地产后周期竣工交付决定家居接单"
    demand_drivers: "地产销售与二手房翻新、消费电子及快消品包装需求、纸制品出口"
    high_frequency_indicators:
      - name: "中国造纸木浆现货与外盘报价指数"
        source: "百川盈孚 / 卓创资讯"
      - name: "规模以上包装与造纸企业月度开工率"
        source: "中国轻工业联合会"

  # -------------------------------------------------------------
  # 2. 科技与 TMT 大类 (Technology & TMT)
  # -------------------------------------------------------------
  电子:
    code: "801080.SI"
    category: "科技/TMT"
    upstream:
      - "硅片、光刻胶、电子特气、靶材"
      - "半导体制造设备 (光刻机/刻蚀机/薄膜沉积/量测)"
    downstream:
      - "智能手机/PC/可穿戴等消费电子"
      - "AI 服务器与云计算数据中心"
      - "智能座舱与自动驾驶域控制器"
    cost_sensitivity: "代工产能利用率与硅片成本 -> 芯片设计毛利率"
    demand_drivers: "全球半导体资本开支周期、AI 算力基建投资、消费电子换机周期"
    high_frequency_indicators:
      - name: "DRAM / NAND Flash 现货与合约价格指数"
        source: "TrendForce 集邦咨询 / CFM 闪存市场"
      - name: "台积电/中芯国际月度营收与产能利用率"
        source: "企业月报 / 彭博"
      - name: "全球与中国智能手机季度出货量"
        source: "IDC / Canalys"

  半导体:
    code: "801081.SI"
    category: "科技/TMT"
    upstream:
      - "半导体硅片/大硅片 (12英寸/8英寸)"
      - "电子级化学品/光刻胶/特种气体"
      - "半导体前道制造设备 (ASML光刻/北方华创刻蚀/中微薄膜)"
    downstream:
      - "AI 加速卡/GPU/高带宽内存 (HBM)"
      - "智能手机/PC SoC 处理器"
      - "汽车功率半导体 (IGBT/SiC 碳化硅)"
      - "工业控制与物联网 MCU"
    cost_sensitivity: "晶圆代工流片成本与良品率 -> Fabless 设计毛利；产线折旧刚性 -> 晶圆代工与封测厂对产能利用率高度敏感"
    demand_drivers: "北美四大云厂商 CapEx、全球半导体销售额 YoY、汽车智能化与国产替代率"
    high_frequency_indicators:
      - name: "SIA 全球半导体月度销售额"
        source: "半导体行业协会 (SIA)"
      - name: "DXI 存储芯片价格综合指数"
        source: "DRAMeXchange"
      - name: "中芯国际/华虹半导体季度产能利用率与晶圆均价"
        source: "上市财报与交流纪要"

  通信:
    code: "801770.SI"
    category: "科技/TMT"
    upstream:
      - "光芯片 (EML/CW光源/VCSEL)"
      - "电芯片 (DSP/TIA/Driver)"
      - "PCB 高速高频板/特种覆铜板"
    downstream:
      - "AI 智算集群与超大规模云数据中心 (800G/1.6T 光模块)"
      - "三大电信运营商 (5G-A 基站与骨干传输网)"
      - "卫星互联网与低轨星座地面终端"
    cost_sensitivity: "高端光电芯片供应偏紧与海外代工成本；技术迭代速度极快，先发红利期毛利高，标准化后年降压力大"
    demand_drivers: "AI 集群光互连带宽需求 (GPU:光模块 1:2.5~1:5 比例)、算力中心内部 InfiniBand/ROCE 架构演进、运营商 CapEx 节奏"
    high_frequency_indicators:
      - name: "800G/1.6T 光模块月度排产与出货量跟踪"
        source: "LightCounting / 券商供应链调研"
      - name: "北美头部云厂商 (微软/谷歌/亚马逊/Meta) 季度资本开支指引"
        source: "企业财报"
      - name: "三大运营商月度 5G/宽带用户数与招标公告"
        source: "工信部 / 运营商官网"

  计算机:
    code: "801750.SI"
    category: "科技/TMT"
    upstream:
      - "服务器 CPU/GPU 算力芯片"
      - "开源大模型与基础开发框架"
      - "云厂商 IaaS 基础设施"
    downstream:
      - "金融科技 (核心交易系统/柜面/风控)"
      - "政务与央国企数字化 (党政信创/行业信创)"
      - "工业互联网与企业级 SaaS"
    cost_sensitivity: "以人力研发薪酬与服务器租赁成本为主；项目制交付周期长，回款与现金流对地方财政预算敏感"
    demand_drivers: "信创招投标放量节奏、大模型商业化落地付费意愿、企业 IT 数字化资本开支"
    high_frequency_indicators:
      - name: "中央及各省市信创软硬件招投标中标金额与批次"
        source: "中国政府采购网"
      - name: "国内主流大模型 API 调用量与 Token 定价趋势"
        source: "头部大模型厂商平台"

  传媒:
    code: "801760.SI"
    category: "科技/内容"
    upstream:
      - "网文/动漫原创 IP、影视文学剧本"
      - "游戏研发引擎 (Unity/Unreal)、AIGC 内容生成工具"
      - "云计算渲染与算力服务器"
    downstream:
      - "全球游戏玩家 (移动端/PC端/主机端)"
      - "院线观影大众与长短视频订阅用户"
      - "效果类广告主与品牌商投放"
    cost_sensitivity: "买量渠道分成成本 (iOS/安卓渠道费与巨量引擎买量投放)；爆款依赖度极高，固定研发折旧摊销"
    demand_drivers: "游戏版号常态化发放节奏、微短剧与小游戏出海放量、AI 生成视频降本增效"
    high_frequency_indicators:
      - name: "国家新闻出版署国产/进口网络游戏月度版号发放名单"
        source: "国家新闻出版署"
      - name: "全国城市院线月度总票房与观影人次"
        source: "猫眼专业版 / 拓普数据"
      - name: "Sensor Tower 中国手游海外收入与下载量排行榜"
        source: "Sensor Tower"

  # -------------------------------------------------------------
  # 3. 先进制造与高端装备 (Advanced Manufacturing & Equipment)
  # -------------------------------------------------------------
  电力设备:
    code: "801730.SI"
    category: "先进制造/新能源"
    upstream:
      - "电池级碳酸锂/氢氧化锂"
      - "正负极材料、隔膜、电解液"
      - "光伏多晶硅致密料、硅片"
      - "铜、铝、特种钢材"
    downstream:
      - "新能源汽车 (动力电池)"
      - "储能电站 (大储/工商业/户储)"
      - "国家电网/南方电网 (特高压/配网)"
      - "风电/光伏集中式与分布式电站"
    cost_sensitivity: "上游碳酸锂/硅料价格暴跌 -> 动力电池及组件系统成本下降 -> 终端装机需求爆发，但中游材料环节面临去库存减值"
    demand_drivers: "全球新能源车渗透率、大储与工商业储能装机量、新型电网资本开支"
    high_frequency_indicators:
      - name: "SMM 电池级碳酸锂现货价"
        source: "上海有色网 (SMM)"
      - name: "InfoLink 周度多晶硅与光伏组件均价"
        source: "InfoLink Consulting"
      - name: "乘联会新能源汽车月度批发/零售销量与渗透率"
        source: "乘联会 (CPCA)"

  汽车:
    code: "801880.SI"
    category: "先进制造/出海"
    upstream:
      - "特种钢材、汽车铝板、工程塑料"
      - "动力电池包、驱动电机、电控 (三电系统)"
      - "汽车芯片 (MCU/域控制器/激光雷达)"
    downstream:
      - "国内乘用车个人消费与网约车营运市场"
      - "海外整车出口 (欧洲/东南亚/中东/拉美)"
      - "售后维保与汽车后市场"
    cost_sensitivity: "碳酸锂及电池成本占纯电整车 30%~40%；价格战内卷对单车毛利形成挤压，出海高毛利对冲国内承压"
